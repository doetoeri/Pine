name: Check Firebase Analytics

on:
  push:
    branches: [main]
    paths:
      - "automation/check-firebase-analytics.mjs"
      - ".github/workflows/check-firebase-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect Firebase Analytics mapping
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: studio-2803086992-2d4cf
          FIREBASE_WEB_APP_ID: 1:747632916477:web:60ad84854cc97deffb8b94
        run: node automation/check-firebase-analytics.mjs
