name: Fix Material route semantics

on:
  push:
    branches:
      - feat/school-life-assistant-2026-09-07
    paths:
      - ".github/workflows/fix-material-route-semantics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/school-life-assistant-2026-09-07
      - name: Keep route aria-current after late custom-element upgrade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("next/app-interactions.js")
          source = path.read_text(encoding="utf-8")
          old = '''function prepareHost(host) {
  if (!(host instanceof HTMLElement)) return;
  const settle = () => {
    bindShadowCapture(host);
    if (!host.hasAttribute("data-route")) return;
    const current = host.getAttribute("data-aria-current") === "page"
      || host.getAttribute("aria-current") === "page";
    setCurrentState(host, current);
  };
  settle();
  queueMicrotask(settle);
  requestAnimationFrame(settle);
  window.setTimeout(settle, 0);
  window.setTimeout(settle, 50);
  const updateComplete = host.updateComplete;
  if (updateComplete && typeof updateComplete.then === "function") {
    updateComplete.then(settle).catch(() => {});
  }
}'''
          new = '''function prepareHost(host) {
  if (!(host instanceof HTMLElement)) return;
  const settle = () => {
    bindShadowCapture(host);
    if (!host.hasAttribute("data-route")) return;
    const current = host.getAttribute("data-aria-current") === "page"
      || host.getAttribute("aria-current") === "page";
    setCurrentState(host, current);
  };
  const settleAfterUpdate = () => {
    settle();
    const updateComplete = host.updateComplete;
    if (updateComplete && typeof updateComplete.then === "function") {
      updateComplete.then(() => {
        settle();
        requestAnimationFrame(settle);
      }).catch(() => {});
    }
  };
  settleAfterUpdate();
  queueMicrotask(settleAfterUpdate);
  requestAnimationFrame(settleAfterUpdate);
  window.setTimeout(settleAfterUpdate, 0);
  window.setTimeout(settleAfterUpdate, 50);
  const tagName = host.localName;
  if (tagName?.includes("-")) {
    customElements.whenDefined(tagName).then(() => {
      settleAfterUpdate();
      requestAnimationFrame(settleAfterUpdate);
    }).catch(() => {});
  }
}'''
          if old not in source:
              raise SystemExit("prepareHost anchor not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate and commit fix
        shell: bash
        run: |
          set -euo pipefail
          node --check next/app-interactions.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next/app-interactions.js
          git commit -m "fix(next): sync route semantics after Material upgrade"
          git push origin HEAD:feat/school-life-assistant-2026-09-07
