name: PinCon Next contracts

on:
  push:
    branches: [rebuild]
    paths:
      - "next/**"
      - ".github/workflows/next-contracts.yml"
  pull_request:
    paths:
      - "next/**"
      - "REBUILD.md"
      - ".github/workflows/next-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            next/app.js \
            next/day2-layer.js \
            next/keyboard-dialog-bridge.js \
            next/admin/admin.js \
            next/core/admin-policy.js \
            next/core/data-gateway.js \
            next/core/notification-store.js \
            next/core/trust-model.js
          do
            node --input-type=module --check < "$file"
          done
      - name: Run Next contract tests
        run: node --test next/tests/contracts.test.mjs next/tests/admin-policy.test.mjs

  firestore-rules:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase emulator test runtime
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
      - name: Run privilege bypass suite
        run: >-
          npx firebase emulators:exec
          --only firestore
          --project pincon-next-rules-test
          --config next/firebase-test.json
          "node --test next/tests/firestore-rules.test.mjs"

  responsive-smoke:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start static preview server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pincon-next-http.log 2>&1 &
          echo $! > /tmp/pincon-next-http.pid
          sleep 1
      - name: Responsive smoke · Chromium
        run: npx playwright test next/tests/ui.spec.mjs --browser=chromium --reporter=line
      - name: Responsive smoke · WebKit
        run: npx playwright test next/tests/ui.spec.mjs --browser=webkit --reporter=line
      - name: Accessibility smoke · Chromium
        run: npx playwright test next/tests/accessibility.spec.mjs --browser=chromium --reporter=line
      - name: Accessibility smoke · WebKit
        run: npx playwright test next/tests/accessibility.spec.mjs --browser=webkit --reporter=line
