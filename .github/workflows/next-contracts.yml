name: PinCon Next contracts

on:
  push:
    branches: [rebuild]
    paths:
      - "next/**"
      - "index.html"
      - "manifest.webmanifest"
      - "pincon-class-ops-data.js"
      - "firestore.rules"
      - "storage.rules"
      - "automation/deploy-firestore-rules.mjs"
      - ".github/workflows/next-contracts.yml"
  pull_request:
    paths:
      - "next/**"
      - "index.html"
      - "manifest.webmanifest"
      - "pincon-class-ops-data.js"
      - "REBUILD.md"
      - "automation/deploy-firestore-rules.mjs"
      - "firestore.rules"
      - "storage.rules"
      - ".github/workflows/firebase-rules.yml"
      - ".github/workflows/next-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            next/app.js \
            next/app-interactions.js \
            next/reveal-loader.js \
            next/write-mode.js \
            next/admin-visibility.js \
            next/problem-bank.js \
            next/admin/admin.js \
            next/admin/bootstrap.js \
            next/admin/brand-settings.js \
            next/admin/content-editor.js \
            next/admin/problem-bank-guide.js \
            next/admin/today-open-write-ui.js \
            next/core/admin-policy.js \
            next/core/brand-settings.js \
            next/core/data-gateway.js \
            next/core/notification-store.js \
            next/core/recovery-pack.js \
            next/core/today-open-write.js \
            next/core/trust-model.js \
            pincon-class-ops-data.js \
            automation/deploy-firestore-rules.mjs
          do
            node --input-type=module --check < "$file"
          done
      - name: Run Next contract tests
        run: >-
          node --test
          next/tests/contracts.test.mjs
          next/tests/admin-policy.test.mjs
          next/tests/today-open-write.test.mjs
          next/tests/problem-bank-contract.test.mjs
          next/tests/recovery-pack.test.mjs

  firestore-rules:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase emulator test runtime
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
      - name: Run privilege bypass suite
        run: >-
          npx firebase emulators:exec
          --only firestore
          --project pincon-next-rules-test
          --config next/firebase-test.json
          "node --test next/tests/firestore-rules.test.mjs"

  responsive-smoke:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start static preview server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pincon-next-http.log 2>&1 &
          echo $! > /tmp/pincon-next-http.pid
          sleep 1
      - name: Boot preflight · Chromium
        run: npx playwright test next/tests/boot.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Boot preflight · WebKit
        run: npx playwright test next/tests/boot.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Reveal loading · Chromium
        run: npx playwright test next/tests/loading.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Reveal loading · WebKit
        run: npx playwright test next/tests/loading.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Root entry · Chromium
        run: npx playwright test next/tests/root-entry.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Root entry · WebKit
        run: npx playwright test next/tests/root-entry.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Admin boot · Chromium
        run: npx playwright test next/tests/admin-boot.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Admin boot · WebKit
        run: npx playwright test next/tests/admin-boot.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Problem bank · Chromium
        run: npx playwright test next/tests/problem-bank.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Problem bank · WebKit
        run: npx playwright test next/tests/problem-bank.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Detail interactions · Chromium
        run: npx playwright test next/tests/detail-interactions.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Detail interactions · WebKit
        run: npx playwright test next/tests/detail-interactions.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Responsive smoke · Chromium
        run: npx playwright test next/tests/ui.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Responsive smoke · WebKit
        run: npx playwright test next/tests/ui.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Navigation integrity · Chromium
        run: npx playwright test next/tests/navigation-integrity.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Navigation integrity · WebKit
        run: npx playwright test next/tests/navigation-integrity.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Phone landscape · Chromium
        run: npx playwright test next/tests/orientation.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Phone landscape · WebKit
        run: npx playwright test next/tests/orientation.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Notification single render · Chromium
        run: npx playwright test next/tests/notification-render.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Notification single render · WebKit
        run: npx playwright test next/tests/notification-render.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Brand tagline · Chromium
        run: npx playwright test next/tests/brand-tagline.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Brand tagline · WebKit
        run: npx playwright test next/tests/brand-tagline.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Route latency · Chromium
        run: npx playwright test next/tests/performance.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Route latency · WebKit
        run: npx playwright test next/tests/performance.spec.mjs --browser=webkit --reporter=line --max-failures=1
      - name: Accessibility smoke · Chromium
        run: npx playwright test next/tests/accessibility.spec.mjs --browser=chromium --reporter=line --max-failures=1
      - name: Accessibility smoke · WebKit
        run: npx playwright test next/tests/accessibility.spec.mjs --browser=webkit --reporter=line --max-failures=1
