name: PinCon Next contracts

on:
  push:
    branches: [main, rebuild]
    paths:
      - "next/**"
      - "sw.js"
      - "registerSW.js"
      - "automation/build-next-precache.mjs"
      - "automation/class-ops-notifications.mjs"
      - "automation/neis-sync.mjs"
      - "voca/fonts/**"
      - "index.html"
      - "manifest.webmanifest"
      - "pincon-class-ops-data.js"
      - "pincon-class-ops-core.js"
      - "firestore.rules"
      - "storage.rules"
      - "automation/deploy-firestore-rules.mjs"
      - ".github/workflows/next-contracts.yml"
  pull_request:
    paths:
      - "next/**"
      - "sw.js"
      - "registerSW.js"
      - "automation/build-next-precache.mjs"
      - "automation/class-ops-notifications.mjs"
      - "automation/neis-sync.mjs"
      - "voca/fonts/**"
      - "index.html"
      - "manifest.webmanifest"
      - "pincon-class-ops-data.js"
      - "pincon-class-ops-core.js"
      - "REBUILD.md"
      - "automation/deploy-firestore-rules.mjs"
      - "firestore.rules"
      - "storage.rules"
      - ".github/workflows/firebase-rules.yml"
      - ".github/workflows/next-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            next/app.js \
            next/app-interactions.js \
            next/app-bootstrap.js \
            next/reveal-loader.js \
            next/write-mode.js \
            next/admin-visibility.js \
            next/evaluation-plan-preview.js \
            next/today-changes.js \
            next/evaluation-plans/service.js \
            next/evaluation-plans/admin.js \
            next/evaluation-plans/student.js \
            next/admin/admin.js \
            next/admin/bootstrap.js \
            next/admin/brand-settings.js \
            next/admin/content-editor.js \
            next/admin/daily-brief-data.js \
            next/admin/daily-brief-renderer.js \
            next/admin/daily-brief-image.js \
            next/admin/evaluation-plan-media.js \
            next/admin/today-open-write-ui.js \
            next/admin/account-create-service.js \
            next/admin/account-create.js \
            next/admin/class-duty-manager.js \
            next/core/admin-policy.js \
            next/core/brand-settings.js \
            next/core/data-gateway.js \
            next/core/evaluation-plan-media.js \
            next/core/notification-store.js \
            next/core/recovery-pack.js \
            next/core/student-auth.js \
            next/core/today-changes.js \
            next/core/today-open-write.js \
            next/core/trust-model.js \
            pincon-class-ops-data.js \
            automation/deploy-firestore-rules.mjs
          do
            node --input-type=module --check < "$file"
          done
      - name: Check offline asset graph
        run: node automation/build-next-precache.mjs && git diff --exit-code -- next/precache-manifest.js
      - name: Run Next contract tests
        run: >-
          node --test
          next/tests/daily-priority.test.mjs
          next/tests/contracts.test.mjs
          next/tests/admin-policy.test.mjs
          next/tests/today-open-write.test.mjs
          next/tests/today-changes.test.mjs
          next/tests/removed-feature-contract.test.mjs
          next/tests/recovery-pack.test.mjs
          next/tests/evaluation-plan-media.test.mjs
          next/tests/daily-brief-image.test.mjs
          next/tests/student-auth-contract.test.mjs
          next/tests/account-create-service.test.mjs
          next/tests/class-duty-manager-contract.test.mjs

  firestore-rules:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase emulator test runtime
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
      - name: Run privilege bypass suite
        run: >-
          npx firebase emulators:exec
          --only firestore
          --project pincon-next-rules-test
          --config next/firebase-test.json
          "node --test --test-concurrency=1 next/tests/firestore-rules.test.mjs next/tests/student-rbac-rules.test.mjs"

  responsive-smoke:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start static preview server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pincon-next-http.log 2>&1 &
          echo $! > /tmp/pincon-next-http.pid
          sleep 1
      - name: All Next browser regressions
        run: npx playwright test next/tests/*.spec.mjs --browser=${{ matrix.browser }} --reporter=line --workers=2 --trace=retain-on-failure
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-browser-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
