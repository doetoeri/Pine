name: PinCon Next contracts

on:
  push:
    branches: [main, rebuild]
    paths:
      - "next/**"
      - "new/**"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "registerSW.js"
      - "pincon-class-ops-data.js"
      - "firebase-messaging-sw.js"
      - "firestore.rules"
      - "storage.rules"
      - "automation/deploy-firestore-rules.mjs"
      - "firebase-experiment-test.json"
      - ".github/workflows/next-contracts.yml"
  pull_request:
    paths:
      - "next/**"
      - "new/**"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "registerSW.js"
      - "pincon-class-ops-data.js"
      - "firebase-messaging-sw.js"
      - "REBUILD.md"
      - "automation/deploy-firestore-rules.mjs"
      - "firestore.rules"
      - "storage.rules"
      - "firebase-experiment-test.json"
      - ".github/workflows/firebase-rules.yml"
      - ".github/workflows/next-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            new/app.js \
            new/calendar.js \
            new/view-motion.js \
            next/app.js \
            next/assessments/coverflow.js \
            next/assessments/attachments.js \
            next/assessments/viewer.js \
            next/assessments/paper-reader.js \
            next/assessments/dialog-motion.js \
            next/admin/content-service-v2.js \
            next/app-interactions.js \
            next/app-bootstrap.js \
            next/detail-history-stability.js \
            next/dialog-focus-stability.js \
            next/theme.js \
            next/reveal-loader.js \
            next/write-mode.js \
            next/admin-visibility.js \
            next/evaluation-plans/student.js \
            next/today-changes.js \
            next/evaluation-plans/service.js \
            next/evaluation-plans/admin.js \
            next/evaluation-plans/student.js \
            next/admin/admin.js \
            next/admin/bootstrap.js \
            next/admin/brand-settings.js \
            next/admin/content-editor-v2.js \
            next/admin/daily-brief-data.js \
            next/admin/daily-brief-renderer.js \
            next/admin/daily-brief-image.js \
            next/evaluation-plans/admin.js \
            next/core/region-renderer.js \
            next/admin/account-create-service.js \
            next/admin/account-create-v2.js \
            next/admin/class-duty-manager.js \
            next/classroom-entry.js \
            next/classroom/classroom.js \
            next/classroom/tv.js \
            next/classroom/seating.js \
            next/classroom/seating-tv.js \
            next/classroom/seating-worker.js \
            integrations/pincon-ai/lib/seating-planner.mjs \
            next/core/admin-policy.js \
            next/core/brand-settings.js \
            next/core/data-gateway.js \
            next/evaluation-plans/service.js \
            next/core/notification-store.js \
            next/core/recovery-pack.js \
            next/core/student-auth.js \
            next/core/today-changes.js \
            next/core/today-open-write.js \
            next/core/trust-model.js \
            next/experiment/constants.js \
            next/experiment/assignment-service.js \
            next/experiment/analytics.js \
            next/experiment/experiment-service.js \
            next/experiment/bootstrap.js \
            next/experiments/pincon-next-ui.js \
            next/experiments/public-beta.js \
            next/experiments/notification-frequency.js \
            next/experiments/ui-satisfaction.js \
            next/admin/experiments.js \
            sw.js \
            registerSW.js \
            firebase-messaging-sw.js \
            pincon-class-ops-data.js \
            automation/deploy-firestore-rules.mjs
          do
            node --input-type=module --check < "$file"
          done
      - name: Run Next contract tests
        run: >-
          node --test
          next/tests/contracts.test.mjs
          next/tests/assessment-attachments.test.mjs
          next/tests/assessment-calendar.test.mjs
          next/tests/admin-policy.test.mjs
          next/tests/today-open-write.test.mjs
          next/tests/today-changes.test.mjs
          next/tests/removed-feature-contract.test.mjs
          next/tests/recovery-pack.test.mjs
          next/tests/evaluation-plan-media.test.mjs
          next/tests/daily-brief-image.test.mjs
          next/tests/student-auth-contract.test.mjs
          next/tests/account-create-service.test.mjs
          next/tests/class-duty-manager-contract.test.mjs
          next/tests/classroom-layout-contract.test.mjs
          next/tests/seating-planner.test.mjs
          next/tests/classroom-officer-tv-contract.test.mjs
          next/tests/e2e-firestore-isolation-contract.test.mjs
          next/tests/experiment-admin-navigation.test.mjs
          next/tests/flux-presence-contract.test.mjs

      - name: Exercise seating HTTP handler with isolated storage
        run: node --experimental-vm-modules --test next/tests/seating-api.test.mjs

  firestore-rules:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase emulator test runtime
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
      - name: Run privilege bypass suite
        run: >-
          npx firebase emulators:exec
          --only firestore
          --project pincon-next-rules-test
          --config next/firebase-test.json
          "node --test next/tests/firestore-rules.test.mjs"
      - name: Run Experiment Platform rules suite
        run: >-
          npx firebase emulators:exec
          --only firestore
          --project pincon-experiment-rules-test
          --config firebase-experiment-test.json
          "node --test next/tests/experiment-platform-firestore-rules.test.mjs"

      - name: Run assessment attachment rules suite
        run: >-
          npx firebase emulators:exec
          --only firestore
          --project pincon-assessment-files-test
          --config firebase-experiment-test.json
          "node --test next/tests/assessment-file-rules.test.mjs"

  responsive-smoke:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start static preview server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pincon-next-http.log 2>&1 &
      - name: Check all responsive, interaction and performance flows
        # Motion samples should measure one WebKit renderer at a time; two
        # software renderers can starve each other's animation-frame clock.
        run: npx playwright test next/tests/*.spec.mjs --browser=${{ matrix.browser }} --workers=${{ matrix.browser == 'webkit' && '1' || '2' }} --reporter=line --max-failures=3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pincon-browser-failure-${{ matrix.browser }}
          path: test-results/
