name: Deploy Pine to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public unpacked
          mkdir -p public unpacked
          unzip -q gochonon-github-ready.zip -d unpacked
          INDEX_PATH="$(find unpacked -type f -name index.html -print -quit)"
          if [ -z "$INDEX_PATH" ]; then
            echo "index.html was not found inside the ZIP"
            find unpacked -maxdepth 4 -print
            exit 1
          fi
          SITE_DIR="$(dirname "$INDEX_PATH")"
          cp -a "$SITE_DIR"/. public/
          touch public/.nojekyll
          echo "Deploying files from: $SITE_DIR"
          find public -maxdepth 4 -type f -print

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
