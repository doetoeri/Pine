name: Fix route data render stability

on:
  push:
    branches:
      - feat/school-life-assistant-2026-09-07
    paths:
      - ".github/workflows/fix-route-data-render-stability.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/school-life-assistant-2026-09-07
      - name: Defer background full renders during route interaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("next/app.js")
          source = path.read_text(encoding="utf-8")

          old = '''let renderTimer = 0;\nlet dataRenderDeferred = false;'''
          new = '''let renderTimer = 0;\nlet dataRenderDeferred = false;\nlet dataRenderQuietUntil = 0;'''
          if old not in source:
              raise SystemExit("state anchor not found")
          source = source.replace(old, new, 1)

          old = '''function scheduleDataRender() {\n  window.clearTimeout(renderTimer);\n  renderTimer = window.setTimeout(() => {\n    if (appDialogBusy()) {\n      dataRenderDeferred = true;\n      return;\n    }\n    dataRenderDeferred = false;\n    render({ preserveView: true });\n  }, 32);\n}'''
          new = '''function scheduleDataRender() {\n  window.clearTimeout(renderTimer);\n  const apply = () => {\n    if (appDialogBusy()) {\n      dataRenderDeferred = true;\n      return;\n    }\n    const remaining = dataRenderQuietUntil - performance.now();\n    if (remaining > 0) {\n      renderTimer = window.setTimeout(apply, Math.ceil(remaining) + 16);\n      return;\n    }\n    dataRenderDeferred = false;\n    render({ preserveView: true });\n  };\n  renderTimer = window.setTimeout(apply, 32);\n}\n\nfunction holdBackgroundRenderForRoute(duration = 700) {\n  dataRenderQuietUntil = Math.max(dataRenderQuietUntil, performance.now() + duration);\n  if (renderTimer) {\n    window.clearTimeout(renderTimer);\n    renderTimer = 0;\n  }\n}'''
          if old not in source:
              raise SystemExit("scheduleDataRender anchor not found")
          source = source.replace(old, new, 1)

          old = '''function navigate(route, { push = true } = {}) {\n  if (!ROUTES.some((item) => item.id === route)) route = "today";\n  if (state.route === route && !state.detailKey) return;'''
          new = '''function navigate(route, { push = true } = {}) {\n  if (!ROUTES.some((item) => item.id === route)) route = "today";\n  if (state.route === route && !state.detailKey) return;\n  holdBackgroundRenderForRoute();'''
          if old not in source:
              raise SystemExit("navigate anchor not found")
          source = source.replace(old, new, 1)

          old = '''  if (routeChanged) {\n    render();\n    return;\n  }'''
          new = '''  if (routeChanged) {\n    holdBackgroundRenderForRoute();\n    render();\n    return;\n  }'''
          if old not in source:
              raise SystemExit("popstate route anchor not found")
          source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY
      - name: Validate and commit fix
        shell: bash
        run: |
          set -euo pipefail
          node --check next/app.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next/app.js
          git commit -m "fix(next): keep route controls stable during background data updates"
          git push origin HEAD:feat/school-life-assistant-2026-09-07
