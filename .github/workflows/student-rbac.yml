name: PinCon student RBAC

on:
  pull_request:
    paths:
      - "next/account-gate.js"
      - "next/account-center.js"
      - "next/account-center.css"
      - "next/app-bootstrap.js"
      - "next/student-ops.js"
      - "next/student-ops.css"
      - "next/student-account.css"
      - "next/core/student-auth.js"
      - "next/admin/admin.js"
      - "next/admin/admin.css"
      - "next/admin/admin-extras.css"
      - "next/admin/admin-shortcuts.js"
      - "next/admin/admin-nav-performance.js"
      - "next/admin/admin-user-access-v2.js"
      - "next/admin/class-switcher.js"
      - "next/admin/bootstrap.js"
      - "next/admin/index.html"
      - "next/admin/user-manager.js"
      - "next/admin/user-manager.css"
      - "next/admin/class-ops-settings.js"
      - "next/admin/class-ops-settings-v2.js"
      - "next/admin/class-ops-settings.css"
      - "next/tests/admin-command-center-contract.test.mjs"
      - "next/tests/admin-mobile-nav-performance.test.mjs"
      - "next/tests/student-auth-contract.test.mjs"
      - "next/tests/student-rbac-rules.test.mjs"
      - "next/firebase-production-test.json"
      - "integrations/pincon-ai/**"
      - "firestore.rules"
      - ".github/workflows/student-rbac.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check new browser and server module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            next/account-gate.js \
            next/account-center.js \
            next/app-bootstrap.js \
            next/student-ops.js \
            next/core/student-auth.js \
            next/admin/admin.js \
            next/admin/admin-shortcuts.js \
            next/admin/admin-nav-performance.js \
            next/admin/admin-user-access-v2.js \
            next/admin/class-switcher.js \
            next/admin/bootstrap.js \
            next/admin/user-manager.js \
            next/admin/class-ops-settings-v2.js \
            integrations/pincon-ai/lib/class-accounts.mjs \
            integrations/pincon-ai/lib/class-operations.mjs \
            integrations/pincon-ai/lib/class-ops-store.mjs \
            integrations/pincon-ai/api/class-ops-router.mjs \
            integrations/pincon-ai/handlers/accounts/session.mjs \
            integrations/pincon-ai/handlers/accounts/manage.mjs \
            integrations/pincon-ai/handlers/accounts/change-pin.mjs \
            integrations/pincon-ai/handlers/class-ops/home.mjs \
            integrations/pincon-ai/handlers/class-ops/cleaning.mjs \
            integrations/pincon-ai/handlers/class-ops/phone.mjs \
            integrations/pincon-ai/handlers/class-ops/subject.mjs \
            integrations/pincon-ai/handlers/class-ops/settings.mjs \
            integrations/pincon-ai/handlers/class-ops/admin-overview.mjs \
            integrations/pincon-ai/scripts/migrate-class-accounts.mjs
          do
            node --input-type=module --check < "$file"
          done
      - name: Install PinCon server dependencies
        run: npm install --prefix integrations/pincon-ai --ignore-scripts
      - name: Run RBAC core tests
        run: npm run test:rbac --prefix integrations/pincon-ai
      - name: Run student auth contracts
        run: node --test next/tests/student-auth-contract.test.mjs
      - name: Run admin command center contracts
        run: node --test next/tests/admin-command-center-contract.test.mjs
      - name: Run mobile admin navigation performance contracts
        run: node --test next/tests/admin-mobile-nav-performance.test.mjs

  production-rules:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase emulator runtime
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
      - name: Verify student operations cannot bypass server APIs
        run: >-
          npx firebase emulators:exec
          --only firestore
          --project pincon-production-rbac-rules-test
          --config next/firebase-production-test.json
          "node --test next/tests/student-rbac-rules.test.mjs"