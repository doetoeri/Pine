name: Build official Fluent 2 Web Components bundle

on:
  push:
    branches: [main]
    paths:
      - "fluent-entry.js"
      - ".github/workflows/build-fluent-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pincon-fluent-web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Microsoft Fluent UI Web Components bundle
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @fluentui/web-components@3.0.2 esbuild@0.25.9
          npx esbuild fluent-entry.js --bundle --format=esm --target=es2020 --minify --outfile=fluent-web.bundle.js
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- fluent-web.bundle.js && git ls-files --error-unmatch fluent-web.bundle.js >/dev/null 2>&1; then
            echo "No Fluent bundle changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fluent-web.bundle.js
          git commit -m "Build official Fluent 2 Web Components bundle" || exit 0
          git push
