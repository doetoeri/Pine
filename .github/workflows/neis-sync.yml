name: Timetable and meal sync

on:
  push:
    branches: [main]
    paths:
      - "automation/**"
      - ".github/workflows/neis-sync.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pincon-school-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - name: Install automation dependencies
        working-directory: automation
        run: |
          npm ci
          npm install --no-save parse-comcigan@1.1.2
      - name: Diagnose Comcigan response
        run: node automation/comcigan-diagnose.mjs
      - name: Sync Comcigan timetable, NEIS fallback and meals
        run: node automation/neis-sync.mjs
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
