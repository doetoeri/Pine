name: Deploy Guardian Parent Hosting

on:
  push:
    branches: [guardian-live]
    paths:
      - "guardian-parent-site/**"
      - "guardian-hosting.json"
      - ".github/workflows/guardian-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-parent-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Firebase credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy Guardian Parent to Firebase Hosting
        run: |
          npx --yes firebase-tools@latest deploy             --only hosting             --project studio-2803086992-2d4cf             --config guardian-hosting.json             --non-interactive
