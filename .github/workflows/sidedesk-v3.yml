name: SideDesk v3 contracts

on:
  push:
    paths:
      - "sidedesk/**"
      - "firestore.rules"
      - ".github/workflows/sidedesk-v3.yml"
  pull_request:
    paths:
      - "sidedesk/**"
      - "firestore.rules"
      - ".github/workflows/sidedesk-v3.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check SideDesk browser module syntax
        run: node --input-type=module --check < sidedesk/app-v3.js
      - name: Run SideDesk static contracts
        run: node --test sidedesk/tests/contracts.test.mjs

  firestore-rules:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase emulator runtime
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
      - name: Run SideDesk participant isolation suite
        run: >-
          npx firebase emulators:exec
          --only firestore
          --project sidedesk-v3-rules-test
          --config sidedesk/firebase-test.json
          "node --test sidedesk/tests/firestore-v3.test.mjs"
