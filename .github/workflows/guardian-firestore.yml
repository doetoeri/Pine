name: Deploy Guardian Firestore rules

on:
  push:
    branches: [guardian-live]
    paths:
      - "firestore.rules"
      - "automation/deploy-firestore-rules.mjs"
      - ".github/workflows/guardian-firestore.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: guardian-firestore-rules
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy combined PinCon + Guardian Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: studio-2803086992-2d4cf
          FIREBASE_STORAGE_BUCKET: studio-2803086992-2d4cf.firebasestorage.app
          FIREBASE_RULES_FIRESTORE_ONLY: "true"
        run: node automation/deploy-firestore-rules.mjs
