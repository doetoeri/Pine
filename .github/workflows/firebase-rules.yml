name: Deploy Firebase rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "automation/deploy-firestore-rules.mjs"
      - ".github/workflows/firebase-rules.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pincon-firestore-rules
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: studio-2803086992-2d4cf
          FIREBASE_STORAGE_BUCKET: studio-2803086992-2d4cf.firebasestorage.app
          FIREBASE_RULES_FIRESTORE_ONLY: "true"
          # 2026-08-24 only: 1-8 authenticated guest editing closes automatically at 23:59:59 KST.
          PINCON_OPEN_WRITE_CLASS: "1-8"
          PINCON_OPEN_WRITE_UNTIL_MS: "1787583599000"
        run: node automation/deploy-firestore-rules.mjs
      - name: Report Firebase rules success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"Firebase Rules\",\"description\":\"Temporary 1-8 Firestore write rules deployed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - name: Report Firebase rules failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"Firebase Rules\",\"description\":\"Firebase Firestore rules deployment failed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
