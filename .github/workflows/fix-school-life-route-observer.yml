name: Fix school-life route observer

on:
  push:
    branches:
      - feat/school-life-assistant-2026-09-07
    paths:
      - ".github/workflows/fix-school-life-route-observer.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/school-life-assistant-2026-09-07
      - name: Narrow school-life MutationObserver to recovery only
        shell: python
        run: |
          from pathlib import Path

          path = Path("next/school-life.js")
          source = path.read_text(encoding="utf-8")

          observer_needle = """  observer = new MutationObserver((records) => {
            const relevant = records.some((record) => {
              const target = record.target instanceof Element
                ? record.target
                : record.target?.parentElement;
              if (target?.closest?.(`#${ROOT_ID}`)) return false;

              const changedElements = [...record.addedNodes, ...record.removedNodes]
                .filter((node) => node.nodeType === Node.ELEMENT_NODE);
              if (!changedElements.length) return true;

              return changedElements.some((node) => (
                node instanceof Element
                && node.id !== ROOT_ID
                && !node.closest?.(`#${ROOT_ID}`)
              ));
            });
            if (relevant) queueRender();
          });
          const app = document.querySelector("#app");
          if (app) observer.observe(app, { childList: true, subtree: true });"""

          observer_replacement = """  observer = new MutationObserver(() => {
            const schoolLifeRoute = ["today", "timetable", "more"].includes(route());
            if (!schoolLifeRoute) return;
            if (document.getElementById(ROOT_ID)) return;
            if (!document.querySelector("#mainContent")) return;
            queueRender();
          });
          const app = document.querySelector("#app");
          if (app) observer.observe(app, { childList: true, subtree: true });"""

          if observer_needle not in source:
            raise SystemExit("observer patch anchor not found")
          source = source.replace(observer_needle, observer_replacement, 1)
          path.write_text(source, encoding="utf-8")
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next/school-life.js
          git diff --cached --check
          git commit -m "fix: stabilize school-life route recovery"
          git push origin HEAD:feat/school-life-assistant-2026-09-07
