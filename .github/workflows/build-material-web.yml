name: Build official Material Web bundle

on:
  push:
    branches: [main]
    paths:
      - "material-entry.js"
      - ".github/workflows/build-material-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pincon-material-web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Google Material Web bundle
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @material/web@2.4.1 esbuild@0.25.9
          npx esbuild material-entry.js --bundle --format=esm --target=es2020 --minify --outfile=material-web.bundle.js
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- material-web.bundle.js && git ls-files --error-unmatch material-web.bundle.js >/dev/null 2>&1; then
            echo "No Material bundle changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add material-web.bundle.js
          git commit -m "Build official Material Web bundle" || exit 0
          git push
