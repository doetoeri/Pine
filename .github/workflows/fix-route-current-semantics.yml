name: Fix route current semantics

on:
  push:
    branches:
      - feat/school-life-assistant-2026-09-07
    paths:
      - ".github/workflows/fix-route-current-semantics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/school-life-assistant-2026-09-07
      - name: Synchronize aria-current after Material shadow DOM upgrades
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("next/app-interactions.js")
          source = path.read_text(encoding="utf-8")
          old = '''function prepareHost(host) {
            if (!(host instanceof HTMLElement)) return;
            bindShadowCapture(host);
            queueMicrotask(() => bindShadowCapture(host));
            requestAnimationFrame(() => bindShadowCapture(host));
            window.setTimeout(() => bindShadowCapture(host), 0);
            window.setTimeout(() => bindShadowCapture(host), 50);
            const updateComplete = host.updateComplete;
            if (updateComplete && typeof updateComplete.then === "function") {
              updateComplete.then(() => bindShadowCapture(host)).catch(() => {});
            }
          }'''.replace('          ', '')
          new = '''function prepareHost(host) {
            if (!(host instanceof HTMLElement)) return;
            const settle = () => {
              bindShadowCapture(host);
              if (!host.hasAttribute("data-route")) return;
              const current = host.getAttribute("data-aria-current") === "page"
                || host.getAttribute("aria-current") === "page";
              setCurrentState(host, current);
            };
            settle();
            queueMicrotask(settle);
            requestAnimationFrame(settle);
            window.setTimeout(settle, 0);
            window.setTimeout(settle, 50);
            const updateComplete = host.updateComplete;
            if (updateComplete && typeof updateComplete.then === "function") {
              updateComplete.then(settle).catch(() => {});
            }
          }'''.replace('          ', '')
          if old not in source:
              raise SystemExit("prepareHost patch anchor not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next/app-interactions.js
          git diff --cached --check
          git commit -m "fix(next): sync route aria-current after Material upgrade"
          git push origin HEAD:feat/school-life-assistant-2026-09-07
