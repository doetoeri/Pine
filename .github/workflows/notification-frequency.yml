name: Notification frequency dispatcher

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "automation/notification*.mjs"
      - "automation/tests/notification-study.test.mjs"
      - "next/experiment/notification-study.js"
      - ".github/workflows/notification-frequency.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pincon-notification-frequency-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - name: Install dependencies
        working-directory: automation
        run: npm ci
      - name: Verify dispatcher without sending
        run: node --test automation/tests/notification-study.test.mjs
      - name: Dispatch notification experiment
        run: node automation/notification-frequency-cron.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
