name: One-time Pincon push test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-push.yml"

permissions:
  contents: read

jobs:
  push-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - name: Install automation dependencies
        working-directory: automation
        run: npm ci
      - name: Send test push to 1-8
        run: node automation/send-test-push.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
