name: School life notifications

on:
  push:
    branches: [main]
    paths:
      - "automation/school-life-*.mjs"
      - "next/core/school-life.js"
      - ".github/workflows/school-life-notifications.yml"
  schedule:
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pincon-school-life-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - name: Install automation dependencies
        working-directory: automation
        run: npm ci
      - name: Dispatch PinCon school-life notifications
        run: node automation/school-life-runner.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
