name: Deploy Storage rules

on:
  push:
    branches: [main]
    paths:
      - "storage.rules"
      - "automation/deploy-storage-rules.mjs"
      - ".github/workflows/storage-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pincon-storage-rules
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy Cloud Storage rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: studio-2803086992-2d4cf
        run: node automation/deploy-storage-rules.mjs
