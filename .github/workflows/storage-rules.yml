name: Deploy Storage rules

on:
  push:
    branches: [main]
    paths:
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/storage-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pincon-storage-rules
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy Cloud Storage rules
        run: npx --yes firebase-tools@latest deploy --only storage --project studio-2803086992-2d4cf --non-interactive
