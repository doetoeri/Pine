name: Apply school life cost optimization

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-school-life-cost-optimization.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/school-life-assistant-2026-09-07'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/school-life-assistant-2026-09-07
      - name: Apply cost controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"target not found in {path}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          scheduler = Path('automation/school-life-notifications.mjs')
          replace_once(scheduler, '''async function queryRows(ref) {
  const snapshot = await ref.get();
  return snapshot.docs.map((document) => ({ id: document.id, ...document.data() }));
}
''', '''async function queryRows(ref) {
  const snapshot = await ref.get();
  return snapshot.docs.map((document) => ({ id: document.id, ...document.data() }));
}

async function queryRowsByIds(collectionRef, ids = []) {
  const uniqueIds = [...new Set((Array.isArray(ids) ? ids : []).map((id) => String(id || "")).filter(Boolean))];
  if (!uniqueIds.length) return [];
  const rows = [];
  for (let index = 0; index < uniqueIds.length; index += 100) {
    const refs = uniqueIds.slice(index, index + 100).map((id) => collectionRef.doc(id));
    const snapshots = await collectionRef.firestore.getAll(...refs);
    for (const snapshot of snapshots) {
      if (snapshot.exists) rows.push({ id: snapshot.id, ...snapshot.data() });
    }
  }
  return rows;
}

function uniqueRows(rows = []) {
  return [...new Map(rows.map((item) => [item.id, item])).values()];
}
''')

          replace_once(scheduler, '''async function loadUserContext(root, user) {
  const userRef = root.collection("schoolLifeUsers").doc(user.uid);
  const [preferenceSnapshot, personalMaterials, materialStates, assessmentStates] = await Promise.all([
    userRef.collection("settings").doc("notifications").get(),
    queryRows(userRef.collection("materials").limit(250)),
    queryRows(userRef.collection("materialStates").limit(600)),
    queryRows(userRef.collection("assessmentStates").limit(400)),
  ]);
  return {
    user,
    preferences: normalizeNotificationPreferences(preferenceSnapshot.exists ? preferenceSnapshot.data() : {}),
    personalMaterials: active(personalMaterials),
    materialStates: Object.fromEntries(materialStates.map((item) => [item.id, item])),
    assessmentStates: Object.fromEntries(assessmentStates.map((item) => [item.id, item])),
  };
}
''', '''async function loadUserContext(root, user, context) {
  const userRef = root.collection("schoolLifeUsers").doc(user.uid);
  const [preferenceSnapshot, recurringMaterials, datedMaterials] = await Promise.all([
    userRef.collection("settings").doc("notifications").get(),
    queryRows(userRef.collection("materials").where("recurrence", "==", "subject-default").limit(100)),
    queryRows(userRef.collection("materials").where("date", ">=", context.date).where("date", "<=", context.tomorrow).limit(160)),
  ]);
  const personalMaterials = active(uniqueRows([...recurringMaterials, ...datedMaterials]));
  const seed = {
    user,
    preferences: normalizeNotificationPreferences(preferenceSnapshot.exists ? preferenceSnapshot.data() : {}),
    personalMaterials,
    materialStates: {},
    assessmentStates: {},
  };
  const relevantBundles = [
    ...bundlesFor(context, seed, context.date),
    ...bundlesFor(context, seed, context.tomorrow),
  ];
  const materialStateIds = relevantBundles.flatMap((bundle) => bundle.materials.map((item) => item.stateKey).filter(Boolean));
  const assessmentStateIds = relevantBundles.flatMap((bundle) => bundle.assessments.map((item) => item.id).filter(Boolean));
  const [materialStates, assessmentStates] = await Promise.all([
    queryRowsByIds(userRef.collection("materialStates"), materialStateIds),
    queryRowsByIds(userRef.collection("assessmentStates"), assessmentStateIds),
  ]);
  return {
    ...seed,
    materialStates: Object.fromEntries(materialStates.map((item) => [item.id, item])),
    assessmentStates: Object.fromEntries(assessmentStates.map((item) => [item.id, item])),
  };
}
''')

          replace_once(scheduler, '''async function subscriptionMap(root) {
  const snapshot = await root.collection("pushSubscriptions").where("enabled", "==", true).get();
  const byUid = new Map();
  for (const document of snapshot.docs) {
    const data = document.data();
    const uid = String(data.ownerUid || "");
    if (!uid || !data.token) continue;
    const group = byUid.get(uid) || [];
    if (!group.some((item) => item.data().token === data.token)) group.push(document);
    byUid.set(uid, group);
  }
  return byUid;
}
''', '''async function subscriptionMap(root) {
  const snapshot = await root.collection("pushSubscriptions").where("enabled", "==", true).get();
  const byUid = new Map();
  for (const document of snapshot.docs) {
    const data = document.data();
    const uid = String(data.ownerUid || "");
    if (!uid || !data.token) continue;
    const group = byUid.get(uid) || [];
    if (!group.some((item) => item.data().token === data.token)) group.push(document);
    byUid.set(uid, group);
  }
  return byUid;
}

function lazySubscriptionMap(root) {
  let promise = null;
  return {
    async get(uid) {
      if (!promise) promise = subscriptionMap(root);
      return (await promise).get(uid) || [];
    },
  };
}
''')

