          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst automation = fs.readFileSync(new URL("../../automation/school-life-notifications.mjs", import.meta.url), "utf8");\nconst schoolLife = fs.readFileSync(new URL("../school-life.js", import.meta.url), "utf8");\nconst inbox = fs.readFileSync(new URL("../school-life-inbox.js", import.meta.url), "utf8");\n\ntest("notification scheduler reads only relevant personal state documents", () => {\n  assert.match(automation, /queryRowsByIds/);\n  assert.match(automation, /collectionRef\\.firestore\\.getAll/);\n  assert.doesNotMatch(automation, /materialStates"\\)\\.limit\\(600\\)/);\n  assert.doesNotMatch(automation, /assessmentStates"\\)\\.limit\\(400\\)/);\n  assert.match(automation, /lazySubscriptionMap/);\n  assert.match(automation, /await subscriptionsByUid\\.get\\(user\\.uid\\)/);\n});\n\ntest("school-life listeners are scoped to visible routes", () => {\n  assert.match(schoolLife, /const key = `\\$\\{identity\\}:\\$\\{currentRoute\\}`/);\n  assert.match(schoolLife, /if \\(\\["today", "timetable"\\]\\.includes\\(currentRoute\\)\\)/);\n  assert.match(schoolLife, /if \\(currentRoute === "more"\\)/);\n  assert.match(schoolLife, /document\\.hidden/);\n  assert.match(inbox, /route\\(\\) !== "more"/);\n  assert.match(inbox, /document\\.hidden/);\n});\n''')

