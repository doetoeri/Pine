name: Apply E2E Firestore isolation patch

on:
  push:
    branches:
      - hotfix/e2e-no-live-firestore-20260908
    paths:
      - .github/workflows/apply-e2e-firestore-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/e2e-no-live-firestore-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guard
        run: node automation/apply-e2e-firestore-guard.mjs
      - name: Add regression contract
        shell: bash
        run: |
          cat > next/tests/e2e-firestore-isolation-contract.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const source = fs.readFileSync(new URL("../../pincon-class-ops-data.js", import.meta.url), "utf8");

          test("local webdriver E2E never connects to the live Firestore project by default", () => {
            assert.match(source, /navigator\?\.webdriver === true/);
            assert.match(source, /\["127\.0\.0\.1", "localhost"\]\.includes\(hostname\)/);
            assert.match(source, /get\("liveFirebase"\) !== "1"/);
            const guard = source.indexOf("if (localAutomationMode())");
            const firebase = source.indexOf("this.api = await firebaseApi()", guard);
            assert.ok(guard >= 0 && firebase > guard, "E2E guard must return before firebaseApi is called");
          });
          EOF
      - name: Verify patch
        run: |
          node --input-type=module --check < pincon-class-ops-data.js
          node --test next/tests/e2e-firestore-isolation-contract.test.mjs
      - name: Remove one-shot patch tools
        run: rm automation/apply-e2e-firestore-guard.mjs .github/workflows/apply-e2e-firestore-guard.yml
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(test): prevent E2E from reading production Firestore"
          git push origin HEAD:hotfix/e2e-no-live-firestore-20260908
