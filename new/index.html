<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fa">
  <meta name="description" content="PinCon 수행평가 커버플로우 · 안내문과 학습지팩">
  <title>PinCon · 수행평가</title>
  <link rel="icon" href="../next/assets/pincon-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../next/assessments/coverflow.css?v=20261009-paper1">
  <link rel="stylesheet" href="./app.css?v=20261009-delete1">
  <link rel="stylesheet" href="../next/assessments/paper-reader.css?v=20261009-paper1">
  <script src="../firebase-config.js?v=20260903-account-fallback1"></script>
  <script src="../registerSW.js?v=20261009-delete1" defer></script>
</head>
<body>
  <main id="covers" aria-label="수행평가 커버플로우"><p class="empty">수행평가를 불러오는 중…</p></main>
  <div class="tools"><button type="button" id="add" aria-label="수행평가 추가" hidden>＋</button><button type="button" id="settings" aria-label="화면과 계정 설정">⚙</button></div>
  <p id="connection" class="connection" role="status" hidden></p>
  <dialog id="details" aria-labelledby="detail-title"></dialog>
  <dialog id="preferences" aria-labelledby="preferences-title">
    <header><h1 id="preferences-title">설정</h1><button type="button" data-close aria-label="닫기">×</button></header>
    <div class="dialog-body">
      <label class="appearance-option"><span><strong>커버 빛 반사</strong><small>기울기에 따라 반사가 자연스럽게 달라져요.</small></span><input id="cover-lighting" class="setting-switch" type="checkbox" role="switch"></label>
      <hr>
      <form id="class-form"><div class="fields"><label>학년<select name="grade"><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select></label><label>반<select name="classNumber"></select></label></div><button type="submit">학급 선택</button></form>
      <hr><p id="account-status"></p>
      <form id="login-form"><label>학번<input name="studentNumber" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="username" required></label><label>PIN<input name="pin" type="password" inputmode="numeric" minlength="6" maxlength="12" autocomplete="current-password" required></label><button type="submit">학생 로그인</button></form>
      <button type="button" id="google-login">Google 관리자 로그인</button>
      <button type="button" id="logout" hidden>로그아웃</button>
      <p class="muted">계정 활성화와 첫 PIN 설정은 <a href="../next/">PinCon 로그인 화면</a>에서 진행해 주세요.</p>
      <button type="button" id="retry">자료 다시 연결</button>
      <p id="preferences-status" role="status"></p>
    </div>
  </dialog>
  <noscript>PinCon을 사용하려면 JavaScript를 켜 주세요.</noscript>
  <script type="module" src="./app.js?v=20261009-delete1"></script>
</body>
</html>
