  <style>
    /* A self-contained greeting: no image, font or module download to await. */
    .pc-startup{position:fixed;inset:0;z-index:10;pointer-events:none;background:var(--pc-scene-background,radial-gradient(ellipse at 50% 43%,#fff 0%,#f8f9fc 48%,#edf0f5 100%));animation:pc-startup-out 200ms 350ms cubic-bezier(.2,.7,.2,1) both;will-change:opacity}
    .pc-startup[hidden]{display:none}
    .pc-startup-mark{position:absolute;--startup-card:min(380px,calc(100vw - 82px),calc((100dvh - 150px) * .65));top:calc(50% - var(--startup-card) * .3);left:50%;width:min(174px,46vw);height:auto;overflow:visible;transform:translate(-50%,-50%);animation:pc-startup-mark 140ms cubic-bezier(.2,.7,.2,1) both}
    .pc-startup-sheen{animation:pc-startup-sheen 260ms 160ms cubic-bezier(.3,0,.2,1) both}
    html[data-startup-light="off"] .pc-startup-sheen{display:none}
    html[data-startup="full"] .tools,html[data-startup="full"] .connection{animation:pc-startup-ui 160ms 620ms ease both}
    html[data-startup="full"] .pc-caption{animation:pc-startup-ui 160ms calc(620ms - var(--pc-startup-elapsed,0ms)) ease both}
    @keyframes pc-startup-mark{from{opacity:0;transform:translate(-50%,-50%) scale(.985)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    @keyframes pc-startup-sheen{from{transform:translateX(0)}to{transform:translateX(var(--pc-startup-sweep))}}
    @keyframes pc-startup-out{from{opacity:1}to{opacity:0}}
    @keyframes pc-startup-ui{from{opacity:0}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.pc-startup{display:none!important}html[data-startup="full"] .tools,html[data-startup="full"] .connection,html[data-startup="full"] .pc-caption{opacity:1;animation:none}}
  </style>
</head>
<body>

  <script>
    (() => {
      const root = document.documentElement, mark = document.querySelector(".pc-startup");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      const day = new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
      let repeat = false, light = true, enabled = true;
      try {
        repeat = localStorage.getItem("pincon-startup-day-v1") === day;
        light = localStorage.getItem("pincon-cover-lighting-v1") !== "off";
        enabled = localStorage.getItem("pincon-startup-enabled-v1") !== "off";
      } catch {}
      const mode = !enabled || reduced.matches || document.hidden ? "none" : repeat ? "short" : "full";
      const duration = mode === "full" ? 800 : mode === "short" ? 200 : 0;
      const state = window.PINCON_STARTUP = { mode, duration, enabled, startAt: performance.now(), finished: false, dismiss: finish };
      const listeners = new AbortController(), timers = [];
      function finish() {
        if (state.finished) return;
        state.finished = true; state.endAt = performance.now();
        timers.forEach(clearTimeout); listeners.abort();
        root.dataset.startup = "ready";
        delete root.dataset.startupLight;
        document.dispatchEvent(new Event("pincon-startup-end"));
        mark.remove();
      }
      root.dataset.startup = mode;
      // Repeat visits go straight to the app's 200ms cover reveal. A second
      // overlay would add a needless pause before cached covers can appear.
      if (mode !== "full") { finish(); return; }
      root.dataset.startupLight = light ? "on" : "off";
      mark.hidden = false;
      mark.getBoundingClientRect();
      try { if (mode === "full") localStorage.setItem("pincon-startup-day-v1", day); } catch {}
      timers.push(setTimeout(finish, duration));
      // Input and reduced-motion always take priority over the greeting.
      for (const type of ["pointerdown", "keydown", "wheel"]) document.addEventListener(type, finish, { capture: true, passive: true, signal: listeners.signal });
      document.addEventListener("visibilitychange", () => { if (document.hidden) finish(); }, { signal: listeners.signal });
      reduced.addEventListener("change", () => { if (reduced.matches) finish(); }, { signal: listeners.signal });
      window.addEventListener("pagehide", finish, { once: true, signal: listeners.signal });
    })();
  </script>
  <div class="tools"><button type="button" id="add" aria-label="수행평가 추가" hidden>＋</button><button type="button" id="view-toggle" aria-label="달력 보기" title="달력 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h2M14 14h2M8 17.5h2"/></svg></button><button type="button" id="settings" aria-label="화면과 계정 설정">⚙</button></div>
  <p id="view-status" class="sr-only" role="status" aria-live="polite"></p>
  <p id="connection" class="connection" role="status" hidden></p>
  <dialog id="details" aria-labelledby="detail-title"></dialog>
  <dialog id="preferences" aria-labelledby="preferences-title">
    <header><h1 id="preferences-title">설정</h1><button type="button" data-close aria-label="닫기">×</button></header>
    <div class="dialog-body">
      <label class="appearance-option"><span><strong>시작 인트로</strong><small>하루 첫 접속에 짧게 인사해요. 켜면 다음 접속부터 보여요.</small></span><input id="startup-enabled" class="setting-switch" type="checkbox" role="switch"></label>
      <label class="appearance-option"><span><strong>커버 빛 반사</strong><small>기울기에 따라 반사가 자연스럽게 달라져요.</small></span><input id="cover-lighting" class="setting-switch" type="checkbox" role="switch"></label>
      <hr>
      <form id="class-form"><div class="fields"><label>학년<select name="grade"><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select></label><label>반<select name="classNumber"></select></label></div><button type="submit">학급 선택</button></form>
      <hr><p id="account-status"></p>
      <form id="login-form"><label>학번<input name="studentNumber" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="username" required></label><label>PIN<input name="pin" type="password" inputmode="numeric" minlength="6" maxlength="12" autocomplete="current-password" required></label><button type="submit">학생 로그인</button></form>
      <button type="button" id="google-login">Google 관리자 로그인</button>
      <button type="button" id="logout" hidden>로그아웃</button>
      <p class="muted">계정 활성화와 첫 PIN 설정은 <a href="../next/">PinCon 로그인 화면</a>에서 진행해 주세요.</p>
      <button type="button" id="retry">자료 다시 연결</button>
      <p id="preferences-status" role="status"></p>
    </div>
  </dialog>
  <noscript>PinCon을 사용하려면 JavaScript를 켜 주세요.</noscript>
