<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9f1" />
    <meta name="description" content="PinCon 학급 허브" />
    <meta name="robots" content="noindex" />
    <title>PinCon</title>
    <link rel="icon" href="./next/assets/pincon-icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Legacy restore assets remain versioned for rollback: pincon-class-ops.css pincon-class-ops.js pincon-unified-shell.css pincon-print-center.css pincon-print-center.js -->
    <style>
      html, body { margin: 0; min-height: 100%; background: #f7f9f1; color: #191d16; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; place-items: center; }
      p { margin: 0; font-size: 14px; }
    </style>
    <script>
      (() => {
        const target = new URL("./next/", location.href);
        target.search = location.search;
        target.hash = location.hash || "#today";
        let moved = false;
        const go = () => {
          if (moved) return;
          moved = true;
          location.replace(target.href);
        };

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => Promise.all(registrations
              .filter((registration) => registration.scope === new URL("./", location.href).href)
              .map((registration) => registration.unregister())))
            .catch(() => {})
            .finally(go);
          window.setTimeout(go, 900);
        } else {
          go();
        }
      })();
    </script>
  </head>
  <body>
    <p>PinCon을 여는 중…</p>
    <noscript><a href="./next/#today">PinCon 열기</a></noscript>
  </body>
</html>
