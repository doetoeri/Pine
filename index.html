    <script>
      (() => {
        const key = "pincon-design-system-v1";
        const allowed = new Set(["material-expressive", "material-expressive-lab"]);
        let mode = "material-expressive";
        try {
          const saved = localStorage.getItem(key);
          if (saved === "material-expressive-beta") mode = "material-expressive-lab";
          else if (allowed.has(saved)) mode = saved;
          localStorage.setItem(key, mode);
        } catch {}
        document.documentElement.dataset.pinconDesign = mode;
      })();
    </script>
