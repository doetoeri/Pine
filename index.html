<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고촌ON</title>
<meta name="theme-color" content="#eef2f7">
<link rel="stylesheet" href="assets/css/figma-sync.css">
<style>
/* Base app styles are intentionally embedded so the site works from GitHub Pages without a build step. */
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;color:#1d1d1f}*{box-sizing:border-box}button,input,select,textarea{font:inherit}.hidden{display:none!important}.topbar{position:sticky;z-index:80}.top-inner{display:flex;align-items:center;justify-content:space-between;height:100%}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.logo{width:34px;height:34px;display:grid;place-items:center;color:#fff}.top-actions{display:flex;align-items:center;gap:8px}.icon-btn,.launcher,.ticket,.btn,.nav-btn{border:0;cursor:pointer}.icon-btn,.launcher{min-height:40px;padding:0 14px}.ticket{padding:10px 15px}.shell{width:min(980px,calc(100% - 28px));margin:0 auto}.hero{padding:82px 0 44px;text-align:center}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:#6e6e73}.hero h1{font-size:clamp(40px,7vw,74px);line-height:1.02;letter-spacing:-.055em;margin:16px 0}.hero p{font-size:18px;line-height:1.65;color:#626268}.hero-actions{display:flex;justify-content:center;gap:10px;margin-top:26px}.btn{padding:13px 18px;font-weight:750}.btn.primary{background:#0071e3;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:20px 0 110px}.card{padding:24px;min-height:220px}.card h2{margin:12px 0 8px;font-size:28px}.card p{color:#68686f;line-height:1.55}.card-icon{font-size:28px}.bottom-nav{display:flex}.nav-btn{display:flex;align-items:center;justify-content:center;color:#63636a}.fab{position:fixed;right:22px;bottom:100px;z-index:75;width:58px;height:58px;border:0;font-size:28px;cursor:pointer}@media(max-width:720px){.hero{padding-top:58px}.hero h1{font-size:46px}.grid{grid-template-columns:1fr}.top-inner{padding:0 12px}.brand span:last-child{display:none}.card{min-height:180px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="top-inner">
    <div class="brand"><span class="logo">ON</span><span>고촌ON</span></div>
    <div class="top-actions"><button class="icon-btn" aria-label="알림">알림</button><button class="launcher">메뉴</button><button class="ticket">학생</button></div>
  </div>
</header>
<main class="shell">
  <section class="hero">
    <div class="eyebrow">TODAY AT GOCHON</div>
    <h1>오늘의 학교생활</h1>
    <p>확인하고, 묻고, 사람을 찾고, 학교를 더 좋게 만드는<br>고촌고의 디지털 광장</p>
    <div class="hero-actions"><button class="btn primary">오늘의 흐름 보기</button><button class="btn">새 소식</button></div>
  </section>
  <section class="grid">
    <article class="card signal-card"><div class="card-icon">◷</div><h2>학교 확인</h2><p>급식, 일정, 공지와 오늘 꼭 알아야 할 내용을 한곳에서 확인합니다.</p><button class="btn">열기</button></article>
    <article class="card pulse-card"><div class="card-icon">?</div><h2>묻고 답하기</h2><p>학교생활 중 생긴 질문을 올리고 학생과 교직원의 답을 모읍니다.</p><button class="btn">질문하기</button></article>
    <article class="card route-card"><div class="card-icon">◎</div><h2>사람 찾기</h2><p>동아리, 운동, 게임, 음악과 행사에 함께할 사람을 발견합니다.</p><button class="btn">모집 보기</button></article>
    <article class="card"><div class="card-icon">✦</div><h2>학교 바꾸기</h2><p>불편한 점과 아이디어를 제안하고 진행 상황을 함께 확인합니다.</p><button class="btn">제안하기</button></article>
  </section>
</main>
<nav class="bottom-nav"><button class="nav-btn active">오늘</button><button class="nav-btn">질문</button><button class="nav-btn">모집</button><button class="nav-btn">제안</button></nav>
<button class="fab" aria-label="새 글 작성">+</button>
<script src="https://cdn.jsdelivr.net/npm/liquid-web@1.1.1/liquid-core.min.js"></script>
<script src="assets/js/liquid-glass-init.js"></script>
</body>
</html>
