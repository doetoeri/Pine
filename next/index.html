<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9f1" />
    <meta name="description" content="PinCon Next beta — 하나의 정보 구조와 데이터 원본으로 다시 만든 학급 허브" />
    <meta name="robots" content="noindex,nofollow" />
    <title>PinCon Next Beta</title>
    <link rel="icon" href="./assets/pincon-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./app-interactions.css" />
    <link rel="stylesheet" href="./ui-polish.css" />
    <script src="../firebase-config.js"></script>
    <script type="module" src="../material-official-loader.js"></script>
  </head>
  <body>
    <div id="pinconBoot" role="status" aria-live="polite" aria-label="PinCon 불러오는 중">
      <div class="pincon-boot__inner">
        <img src="./assets/pincon-icon.svg" alt="" />
        <div class="pincon-boot__copy">
          <strong>PinCon</strong>
          <span>학급 허브를 준비하는 중</span>
        </div>
        <md-linear-progress class="pincon-boot__progress" four-color indeterminate aria-label="PinCon 불러오는 중"></md-linear-progress>
      </div>
    </div>
    <div id="app" aria-live="polite"></div>
    <noscript>PinCon Next를 사용하려면 JavaScript가 필요합니다.</noscript>
    <script type="module" src="./ui-polish.js"></script>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./app-interactions.js"></script>
  </body>
</html>
