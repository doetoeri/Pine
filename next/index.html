    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PinCon Beta" />

    <link rel="icon" href="./assets/pincon-icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./dialog-polish.css?v=20260825-device3" />
    <link rel="stylesheet" href="./problem-bank.css" />

    <link rel="stylesheet" href="./student-account.css?v=20260828-rbac1" />
    <link rel="stylesheet" href="./student-ops.css?v=20260828-rbac1" />

  </head>
  <body>
    <a class="skip-link" href="#mainContent">본문으로 바로 이동</a>
    <div id="pinconBoot" role="status" aria-live="polite" aria-label="PinCon 불러오는 중">
      <div id="pinconBootField" aria-hidden="true"></div>
      <span class="pincon-boot__sr-only">PinCon 학급 허브를 준비하는 중</span>
    </div>
    <div id="app"></div>
    <noscript>PinCon을 사용하려면 JavaScript가 필요합니다.</noscript>
    <script>
      (() => {
        const ROUTES = new Set(["today", "timetable", "schedule", "classroom", "more"]);

        function eventHost(event, predicate) {
          return event.composedPath?.().find((node) => node instanceof HTMLElement && predicate(node)) || null;
        }

        function currentRoute() {
          const route = location.hash.replace(/^#/, "").split("/")[0];
          return ROUTES.has(route) ? route : "today";
        }

        function commitCapturedRoute(route) {
          if (!ROUTES.has(route) || currentRoute() === route) return;
          history.pushState({ route, detailKey: "" }, "", `#${route}`);
          window.dispatchEvent(new PopStateEvent("popstate", { state: history.state }));
        }

        function replayRouteWhenReady(route) {
          let frames = 0;
          const replay = () => {
            if (globalThis.PinConNext) {
              commitCapturedRoute(route);
              return;
            }
            frames += 1;
            if (frames < 180) requestAnimationFrame(replay);
          };
          requestAnimationFrame(replay);
        }

        function notificationDialogIsOpen() {
          const dialog = document.querySelector("#notificationDialog");
          return Boolean(dialog && (
            dialog.open === true
            || dialog.hasAttribute("open")
            || dialog.getAttribute("data-pincon-opening") === "true"
          ));
        }

        function replayNotificationWhenNeeded() {
          let frames = 0;
          const replay = () => {
            if (notificationDialogIsOpen()) return;
            const trigger = document.querySelector("#openNotifications");
            if (!trigger) return;
            if (trigger.hasAttribute("data-aria-label")) {
              trigger.click();
              return;
            }
            frames += 1;
            if (frames < 180) requestAnimationFrame(replay);
          };
          window.setTimeout(replay, 0);
        }

        document.addEventListener("click", (event) => {
          const routeControl = eventHost(event, (node) => node.hasAttribute("data-route"));
          if (!routeControl) return;
          const route = routeControl.getAttribute("data-route") || "";
          if (globalThis.PinConNext) commitCapturedRoute(route);
          else replayRouteWhenReady(route);
        }, true);

        document.addEventListener("pointerup", (event) => {
          const trigger = eventHost(event, (node) => node.id === "openNotifications");
          if (!trigger) return;
          replayNotificationWhenNeeded();
        }, true);
      })();
    </script>
    <script type="module" src="./reveal-loader.js"></script>
    <script type="module" src="../pincon-guest-auth.js"></script>
    <script type="module" src="./app-bootstrap.js"></script>
  </body>
</html>
