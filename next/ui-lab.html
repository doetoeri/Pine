  <noscript>PinCon을 사용하려면 JavaScript가 필요합니다.</noscript>
  <script>
    (()=>{const ROUTES=new Set(["today","timetable","schedule","classroom","more"]);function host(e,p){return e.composedPath?.().find(n=>n instanceof HTMLElement&&p(n))||null}function route(){const r=location.hash.replace(/^#/,"").split("/")[0];return ROUTES.has(r)?r:"today"}function commit(r){if(!ROUTES.has(r)||route()===r)return;history.pushState({route:r,detailKey:""},"",`#${r}`);window.dispatchEvent(new PopStateEvent("popstate",{state:history.state}))}function replay(r){let f=0;const go=()=>{if(globalThis.PinConNext){commit(r);return}if(++f<180)requestAnimationFrame(go)};requestAnimationFrame(go)}document.addEventListener("click",e=>{const c=host(e,n=>n.hasAttribute("data-route"));if(!c||globalThis.PinConNext)return;replay(c.getAttribute("data-route")||"")},true)})();
  </script>
  <script>
    (()=>{const THEMES=["aurora","editorial","bento","signal","orbit"],KEY="pincon-ui-lab-theme",root=document.documentElement,label=document.getElementById("uiLabRoute"),app=document.getElementById("app");function route(){const r=location.hash.replace(/^#/,"").split("/")[0];return["today","timetable","schedule","classroom","more"].includes(r)?r:"today"}function syncRoute(){const r=route();document.body.dataset.labRoute=r;if(label)label.textContent=r}function theme(t,p=true){if(!THEMES.includes(t))t=THEMES[0];root.dataset.uiLab=t;document.querySelectorAll("[data-lab-theme]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.labTheme===t?"true":"false"));if(p)try{localStorage.setItem(KEY,t)}catch{}}document.addEventListener("click",e=>{const b=e.target.closest?.("[data-lab-theme]");if(b)theme(b.dataset.labTheme)});document.addEventListener("keydown",e=>{const x=e.target,typing=x instanceof HTMLInputElement||x instanceof HTMLTextAreaElement||x?.isContentEditable;if(typing||e.altKey||e.ctrlKey||e.metaKey)return;const i=Number(e.key)-1;if(THEMES[i])theme(THEMES[i])});function device(){const w=innerWidth;document.body.dataset.labDevice=w<=600?"mobile":w<=1180?"tablet":"chromebook";document.body.dataset.labPointer=matchMedia("(pointer:coarse)").matches?"touch":"fine"}function motion(){if(!app||matchMedia("(prefers-reduced-motion:reduce)").matches)return;app.classList.remove("pincon-route-enter");requestAnimationFrame(()=>app.classList.add("pincon-route-enter"));setTimeout(()=>app.classList.remove("pincon-route-enter"),680)}window.addEventListener("hashchange",()=>{syncRoute();motion()});window.addEventListener("popstate",()=>{syncRoute();motion()});window.addEventListener("resize",device,{passive:true});try{theme(localStorage.getItem(KEY)||THEMES[0],false)}catch{theme(THEMES[0],false)}syncRoute();device();if(app)new MutationObserver(motion).observe(app,{childList:true})})();
  </script>
