<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6f1" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>PinCon Flow · Rim Button Beta</title>
  <link rel="icon" href="../assets/pincon-icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./flow.css?v=20260909-1" />
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const share = params.get("_vercel_share");
      const withShare = (url) => {
        if (!share) return url;
        const separator = url.includes("?") ? "&" : "?";
        return `${url}${separator}_vercel_share=${encodeURIComponent(share)}`;
      };
      globalThis.PINCON_FLOW_WITH_SHARE = withShare;

      const material = document.createElement("link");
      material.rel = "stylesheet";
      material.href = withShare("./flow-hig.css?v=20260909-3");
      material.dataset.pinconMaterial = "hig-base";
      document.head.appendChild(material);

      const rim = document.createElement("link");
      rim.rel = "stylesheet";
      rim.href = withShare("./flow-button-rim.css?v=20260909-1");
      rim.dataset.pinconButtonMaterial = "subtle-rim-v4";
      document.head.appendChild(rim);
    })();
  </script>
  <script src="../../firebase-config.js?v=20260903-account-fallback1"></script>
</head>
<body data-hig-beta="4" data-material="subtle-rim">
  <div class="flow-boot" id="flowBoot" role="status" aria-live="polite">
    <img src="../assets/pincon-icon.svg" alt="" />
    <div><strong>PinCon Flow</strong><span id="flowBootText">오늘을 정리하는 중</span></div>
  </div>

  <div id="flowApp"></div>

  <dialog class="flow-sheet" id="flowSheet" aria-labelledby="flowSheetTitle">
    <form method="dialog" class="flow-sheet__chrome">
      <div class="flow-sheet__grab" aria-hidden="true"></div>
      <button class="icon-button" value="cancel" aria-label="닫기">×</button>
    </form>
    <div class="flow-sheet__content" id="flowSheetContent"></div>
  </dialog>

  <noscript>PinCon Flow를 사용하려면 JavaScript가 필요합니다.</noscript>

  <script>
    (() => {
      const timer = setTimeout(() => {
        const boot = document.getElementById("flowBoot");
        const app = document.getElementById("flowApp");
        const text = document.getElementById("flowBootText");
        if (!boot || boot.classList.contains("is-hidden")) return;
        if (text) text.textContent = "불러오기에 실패했습니다";
        if (app && !app.children.length) {
          app.innerHTML = `<main class="profile-gate">
            <img src="../assets/pincon-icon.svg" alt="PinCon" />
            <h1>Flow를 열지 못했습니다.</h1>
            <p>베타 화면을 불러오는 중 문제가 생겼습니다.</p>
            <button onclick="location.href='../'">기존 PinCon 열기</button>
          </main>`;
        }
        boot.classList.add("is-hidden");
      }, 7000);
      window.addEventListener("pincon-flow-ready", () => clearTimeout(timer), { once: true });
    })();
  </script>

  <script type="module" src="./flow.js?v=20260909-2"></script>
  <script type="module">
    const withShare = globalThis.PINCON_FLOW_WITH_SHARE || ((url) => url);
    try {
      await import(withShare("./flow-interactions.js?v=20260909-2"));
      document.body.dataset.higInteractions = "ready";
    } catch (error) {
      document.body.dataset.higInteractions = "failed";
      console.error("[PinCon Flow] interaction layer failed", error);
    }
  </script>
</body>
</html>
