<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fa">
  <meta name="description" content="영분선 후보의 길이, 비용, 시간 절감량을 비교하는 ALTERWAY 수학 시연입니다.">
  <title>ALTERWAY · 수학 탐구 발표</title>
  <base href="/alterway/">
  <script>if (location.protocol === 'file:') document.querySelector('base').href = new URL('../', location.href).href;</script>
  <link rel="stylesheet" href="assets/alterway.css?v=1">
  <script defer src="assets/data.js?v=1"></script>
  <script defer src="assets/engine.js?v=1"></script>
  <script defer src="assets/map.js?v=1"></script>
  <script defer src="assets/study.js?v=1"></script>
  <script defer src="assets/presence.js?v=1"></script>
  <script defer src="assets/app.js?v=3"></script>
</head>
<body data-mode="present">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M5 22 14 5l9 17M9 16h10"/></svg></span><span>ALTERWAY<small>수학 탐구 발표 · 영분선</small></span></div>
    <div class="header-actions">
      <span class="connection" id="presenceStatus" role="status">접속 연결 중</span>
      <a class="mode-link" href="index.html" id="modeLink">일반 화면</a>
      <button type="button" class="fullscreen" id="fullscreen">전체화면 <kbd>F</kbd></button>
    </div>
  </header>
  <main class="layout" id="layout">
    <section class="map-panel" aria-label="철도망 노선도">
      <div class="map-toolbar present-toolbar">
        <div class="map-scene" id="mapScene">수도권 기준망</div>
        <div class="map-actions"><button type="button" id="fitMap">전체</button></div>
      </div>
      <div class="canvas-frame">
        <canvas id="mapCanvas" aria-label="연구에 사용한 가상 수도권 노선도와 후보 노선"></canvas>
        <canvas id="motionCanvas" aria-hidden="true"></canvas>
        <div class="map-legend" id="mapLegend"><span><i class="key base"></i>기존망</span><span><i class="key line"></i>영분선</span><span><i class="key person"></i>익명 접속</span></div>
      </div>
      <div class="map-footer"><span>2040 가상 철도망 · 역 위치를 잇는 개략도</span><span id="mapCaption">기준망</span></div>
    </section>
    <aside class="story-panel" aria-labelledby="storyTitle">
      <div id="storyCard" class="story-card" aria-live="polite"></div>
    </aside>
  </main>
  <footer class="present-nav">
    <button type="button" id="prevScene">← 이전</button>
    <nav id="sceneSteps" aria-label="발표 장면"></nav>
    <span class="keyboard-hint"><kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>Space</kbd></span>
    <button type="button" class="primary" id="nextScene">다음 →</button>
  </footer>
  <noscript>발표 화면을 보려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
