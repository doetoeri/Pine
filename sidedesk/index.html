<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c49c6b"><title>SideDesk</title><script src="../firebase-config.js"></script><style>
:root{font-family:Pretendard,Inter,system-ui,-apple-system,sans-serif;color:#30271d;background:#c9aa82}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at 50% -10%,#efe1cf,#d3b78f 45%,#a9794d)}button,input,select{font:inherit}.app{min-height:100vh;padding:clamp(10px,2vw,22px)}.shell{max-width:1160px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:11px}.logo{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,#f0e5d4,#bca383);border:1px solid #897259;box-shadow:inset 0 2px #fff,0 4px #796146,0 8px 17px #54381f44}.title{margin:0;font-size:clamp(24px,4vw,35px);line-height:1}.muted{font-size:13px;color:#756451}.badge{font-size:13px;padding:8px 11px;border-radius:999px;background:#eee3d3;border:1px solid #b19b7e;box-shadow:inset 0 1px #fff;white-space:nowrap}.desk{position:relative;overflow:hidden;padding:clamp(14px,2vw,22px);border-radius:29px;background:linear-gradient(145deg,#dec39c,#b48658);border:1px solid #876544;box-shadow:inset 0 2px #f4dfbf,inset 0 -3px #704b2b55,0 14px 30px #50351f3b}.desk:before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;background:repeating-linear-gradient(7deg,transparent 0 30px,#66401e33 31px,transparent 32px 62px)}.desk>*{position:relative}.lobby{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.paper{background:linear-gradient(#f8f0e4,#ded0bb);border:1px solid #9e896e;border-radius:22px;box-shadow:inset 0 2px #fff,0 4px #927455,0 9px 18px #50351f33;padding:20px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:800}.input,.select{width:100%;min-height:49px;padding:11px 12px;border-radius:14px;border:1px solid #9a876f;background:#fcf7ef;color:#30271d;box-shadow:inset 0 2px 4px #6c543326;font-size:16px;outline:0}.input:focus,.select:focus{box-shadow:inset 0 2px 4px #6c543326,0 0 0 3px #69845b38}.btn{min-height:52px;padding:11px 15px;border:1px solid #8b7257;border-radius:17px;background:linear-gradient(#fbf4e9,#d5c5ad);color:#342a20;font-weight:850;box-shadow:inset 0 2px #fff,0 5px #7b6248,0 9px 15px #49321e3c;transition:.08s}.btn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 5px #0002,0 1px #705740}.btn:disabled{opacity:.45}.primary{background:linear-gradient(#dce9cf,#a3bb90);border-color:#708b62;box-shadow:inset 0 2px #f3f8ed,0 5px #647b57,0 9px 15px #374a2e33}.code{font:700 clamp(28px,6vw,48px) ui-monospace,monospace;letter-spacing:.17em;text-align:center;padding:17px;border-radius:18px;background:#202722;color:#cde8c4;text-shadow:0 0 12px #89c57b55;box-shadow:inset 0 0 20px #000b,0 3px #fff4}.status{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:11px 12px;border-radius:14px;background:#eadfce;box-shadow:inset 0 2px 4px #5d45292a}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#929086}.dot.on{background:#6d9762;box-shadow:0 0 0 3px #6d976222}.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px}.study{display:grid;grid-template-columns:1fr .44fr 1fr;gap:14px}.player{min-width:0}.head{display:flex;justify-content:space-between;gap:8px;align-items:center}.num{font-size:clamp(38px,7vw,68px);font-weight:950;line-height:1;letter-spacing:-.05em}.progress{height:15px;border-radius:999px;background:#c6b39a;overflow:hidden;box-shadow:inset 0 2px 4px #4e39292f}.bar{height:100%;width:0;border-radius:inherit;background:linear-gradient(#879f75,#506d49);transition:width .3s}.friendbar{background:linear-gradient(#929bad,#606a7c)}.timer{display:grid;place-items:center;text-align:center;min-height:150px;padding:14px;border-radius:22px;background:linear-gradient(#252d29,#171d1a);color:#c9e1c1;border:1px solid #3e4942;box-shadow:inset 0 0 20px #000c,0 3px #fff3;font-family:ui-monospace,monospace}.timer strong{display:block;font-size:clamp(30px,4.5vw,50px);letter-spacing:.06em}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.action{min-height:74px;font-size:18px}.secondary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.live{margin-top:14px;min-height:54px;padding:14px 16px;border-radius:17px;background:#e6d4bb;box-shadow:inset 0 2px 4px #5b432b35;display:flex;align-items:center}.trace{display:grid;gap:7px;margin-top:11px}.trace div{padding:9px 11px;border-radius:12px;background:#f2e9ddcc;border:1px solid #c0ad94;font-size:13px}.flash{animation:press .45s ease}@keyframes press{35%{transform:translateY(5px) scale(.994);box-shadow:inset 0 2px 5px #0002,0 1px #927455}}.sync{animation:sync .7s ease}@keyframes sync{40%{filter:brightness(1.18)}}.error{margin-top:12px;padding:10px 12px;border-radius:12px;color:#742c24;background:#f2d5d0;border:1px solid #c68d84}.hidden{display:none}.small{font-size:12px;color:#6c5c49;line-height:1.5}
@media(max-width:850px){.lobby{grid-template-columns:1fr}.study{grid-template-columns:1fr 1fr}.timer{grid-column:1/-1;grid-row:1}}@media(max-width:560px){.study,.mini,.actions,.secondary{grid-template-columns:1fr}.timer{grid-column:auto;grid-row:auto}.top{align-items:flex-start}.desk{border-radius:23px}.badge{max-width:42vw;overflow:hidden;text-overflow:ellipsis}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"><main class="app"><div class="shell"><div class="paper" style="max-width:420px;margin:18vh auto;text-align:center"><div class="logo" style="margin:auto">SD</div><h2>SideDesk</h2><div class="muted">책상을 연결하는 중…</div></div></div></main></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,collection,addDoc,serverTimestamp,runTransaction,query,orderBy,limit}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
const A=document.querySelector('#app'),cfg=globalThis.PINCON_FIREBASE_CONFIG;let authUid='',room='',role='',name='',R=null,unsub,eu,timer,started=0,cut=Date.now(),ownAt=0;
const E=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),C=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6),D=v=>({1:'가벼움',2:'보통',3:'어려움',4:'매우 어려움'})[+v]||'보통',P=p=>p?.total?Math.min(100,Math.round((p.done||0)/p.total*100)):0,ACC=p=>{let n=(p?.correct||0)+(p?.wrong||0);return n?Math.round((p.correct||0)/n*100):null},code=()=>{let s='',c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<6;i++)s+=c[Math.random()*c.length|0];return s},player=n=>({uid:authUid,nickname:n,total:20,difficulty:2,done:0,correct:0,wrong:0,skipped:0,status:'ready',updatedAtMs:Date.now()});
if(!cfg){fail('Firebase 설정을 찾지 못했습니다.');throw 0}const fa=initializeApp(cfg,'sidedesk'),auth=getAuth(fa),db=getFirestore(fa);
function fail(m){A.innerHTML='<main class="app"><div class="shell"><div class="paper error" style="max-width:520px;margin:20vh auto">'+E(m)+'</div></div></main>'}
function landing(){A.innerHTML='<main class="app"><div class="shell"><header class="top"><div class="brand"><div class="logo">SD</div><div><h1 class="title">SideDesk</h1><div class="muted">멀리 있어도 같은 책상처럼.</div></div></div><span class="badge">● 실시간 연결됨</span></header><section class="desk lobby"><div class="paper"><h2 style="margin-top:0">공부방 만들기</h2><p class="muted">문제집은 각자. 여기서는 서로의 진행과 손짓만 연결합니다.</p><div class="field"><label>닉네임</label><input id="hn" class="input" maxlength="14" placeholder="예: 도영"></div><button id="mk" class="btn primary" style="width:100%;margin-top:14px">새 방 만들기</button></div><div class="paper"><h2 style="margin-top:0">친구 방 참가</h2><p class="muted">6자리 코드면 됩니다. 회원가입 서류는 없습니다.</p><div class="field"><label>닉네임</label><input id="gn" class="input" maxlength="14"></div><div class="field" style="margin-top:10px"><label>방 코드</label><input id="jc" class="input" maxlength="6" style="text-transform:uppercase;letter-spacing:.14em"></div><button id="jn" class="btn" style="width:100%;margin-top:14px">방 들어가기</button><div id="err" class="error hidden"></div></div></section></div></main>';mk.onclick=create;jn.onclick=join;jc.oninput=e=>e.target.value=C(e.target.value)}
const err=m=>{let e=document.querySelector('#err');if(e){e.textContent=m;e.classList.remove('hidden')}};
async function create(){let n=hn.value.trim();if(!n)return err('닉네임을 입력해 주세요.');name=n;role='host';for(let i=0;i<5;i++){let x=code(),r=doc(db,'sidedeskRooms',x);if((await getDoc(r)).exists())continue;room=x;await setDoc(r,{version:1,status:'lobby',host:player(n),guest:null,createdAtMs:Date.now(),startedAtMs:null,updatedAt:serverTimestamp()});lobby();bind();return}err('방 코드를 만들지 못했습니다.')}
async function join(){let n=gn.value.trim(),x=C(jc.value);if(!n)return err('닉네임을 입력해 주세요.');if(x.length!==6)return err('6자리 코드를 입력해 주세요.');try{let r=doc(db,'sidedeskRooms',x);await runTransaction(db,async t=>{let s=await t.get(r);if(!s.exists())throw Error('없음');let d=s.data();if(d.status!=='lobby')throw Error('시작');if(d.guest)throw Error('가득');t.update(r,{guest:player(n),updatedAt:serverTimestamp()})});room=x;name=n;role='guest';lobby();bind()}catch(e){err(e.message==='없음'?'방을 찾지 못했습니다.':e.message==='가득'?'이미 두 명이 들어와 있습니다.':e.message==='시작'?'이미 시작한 방입니다.':'입장하지 못했습니다.')}}
function lobby(){A.innerHTML='<main class="app"><div class="shell"><header class="top"><div class="brand"><div class="logo">SD</div><div><h1 class="title">SideDesk</h1><div class="muted">원격 옆자리 준비</div></div></div><span class="badge">ROOM '+room+'</span></header><section class="desk lobby"><div class="paper"><div class="muted">ROOM CODE</div><div class="code" style="margin-top:8px">'+room+'</div><div class="status" style="margin-top:14px"><span><i class="dot on"></i> <b>'+E(name)+'</b></span><span>준비됨</span></div><div class="status" style="margin-top:8px"><span><i id="fd" class="dot"></i> <b id="fn">친구 기다리는 중</b></span><span id="fr">대기</span></div><p class="small">친구가 문항 수나 난이도를 바꾸는 것도 이 화면에 바로 반영됩니다.</p></div><div class="paper"><h2 style="margin-top:0">내 세션 설정</h2><div class="mini"><div class="field"><label>문항 수</label><input id="tot" class="input" type="number" min="1" max="200" value="20"></div><div class="field"><label>난이도</label><select id="dif" class="select"><option value="1">가벼움</option><option value="2" selected>보통</option><option value="3">어려움</option><option value="4">매우 어려움</option></select></div></div><div id="fs" class="status" style="margin-top:14px">친구 설정을 기다리는 중…</div><button id="go" class="btn primary" style="width:100%;margin-top:14px" '+(role==='host'?'disabled':'disabled')+'>'+(role==='host'?'친구를 기다리는 중':'방장이 시작하면 자동 시작')+'</button><button class="btn" id="leave" style="width:100%;margin-top:10px">나가기</button></div></section></div></main>';tot.onchange=dif.onchange=settings;leave.onclick=()=>location.reload();if(role==='host')go.onclick=start}
async function settings(){if(!R)return;let p={...R[role],total:Math.max(1,Math.min(200,+tot.value||20)),difficulty:Math.max(1,Math.min(4,+dif.value||2)),updatedAtMs:Date.now()};await updateDoc(doc(db,'sidedeskRooms',room),{[role]:p,updatedAt:serverTimestamp()})}
async function start(){if(role!=='host'||!R?.guest)return;let t=Date.now();await updateDoc(doc(db,'sidedeskRooms',room),{host:{...R.host,status:'solving',updatedAtMs:t},guest:{...R.guest,status:'solving',updatedAtMs:t},status:'studying',startedAtMs:t,updatedAt:serverTimestamp()});event('start')}
function bind(){unsub?.();eu?.();cut=Date.now();unsub=onSnapshot(doc(db,'sidedeskRooms',room),s=>{if(!s.exists())return fail('방이 사라졌습니다.');R=s.data();if(R.status==='studying'&&!document.querySelector('#study'))study();if(document.querySelector('#tot'))ul();if(document.querySelector('#study'))us()});let q=query(collection(db,'sidedeskRooms',room,'events'),orderBy('clientTs','desc'),limit(25));eu=onSnapshot(q,s=>s.docChanges().forEach(c=>{let e=c.doc.data();if(c.type==='added'&&e.uid!==authUid&&(e.clientTs||0)>=cut)remote(e)}))}
function ul(){let m=R[role],f=R[role==='host'?'guest':'host'];if(m&&document.activeElement!==tot){tot.value=m.total;dif.value=m.difficulty}if(f){fd.classList.add('on');fn.textContent=f.nickname;fr.textContent='준비됨';fs.textContent=f.nickname+': '+f.total+'문항 · '+D(f.difficulty);if(role==='host'){go.disabled=false;go.textContent='둘이 같이 시작'}}}
function study(){started=R.startedAtMs||Date.now();A.innerHTML='<main class="app" id="study"><div class="shell"><header class="top"><div class="brand"><div class="logo">SD</div><div><h1 class="title">Shared Desk</h1><div class="muted">각자 다른 문제, 같은 공부 시간.</div></div></div><span id="rs" class="badge">● 같이 공부 중</span></header><section id="desk" class="desk"><div class="study"><div class="paper player" id="me"><div class="head"><b id="mn">나</b><span id="ms" class="muted">풀이 중</span></div><div style="margin:18px 0 10px"><span id="md" class="num">0</span><span class="muted"> / <span id="mt">20</span></span></div><div class="progress"><div id="mb" class="bar"></div></div><div class="head" style="margin-top:10px"><span id="mp" class="muted">0%</span><span id="ma" class="muted">정확도 -</span></div></div><div class="timer"><div><span class="muted" style="color:#9fb49a">STUDY TIME</span><strong id="clock">00:00</strong><span id="pace" class="muted" style="color:#aabca6">같이 시작함</span></div></div><div class="paper player" id="friend"><div class="head"><b id="xn">친구</b><span id="xs" class="muted">풀이 중</span></div><div style="margin:18px 0 10px"><span id="xd" class="num">0</span><span class="muted"> / <span id="xt">20</span></span></div><div class="progress"><div id="xb" class="bar friendbar"></div></div><div class="head" style="margin-top:10px"><span id="xp" class="muted">0%</span><span id="xa" class="muted">정확도 -</span></div></div></div><div class="actions"><button id="ok" class="btn action">✓ 정답</button><button id="no" class="btn action">× 오답</button><button id="sk" class="btn action">→ 보류</button></div><div class="secondary"><button id="tap" class="btn">책상 톡</button><button id="pause" class="btn">잠깐 멈춤</button></div><div id="live" class="live">친구의 행동이 여기에 바로 나타납니다.</div><div id="trace" class="trace"></div></section></div></main>';ok.onclick=()=>mark('correct');no.onclick=()=>mark('wrong');sk.onclick=()=>mark('skip');tap.onclick=async()=>{await event('tap');msg('친구 책상을 톡 건드렸습니다.');tr(name+' · 책상 톡');navigator.vibrate?.(18)};pause.onclick=pa;ticker();us()}
async function mark(type){let ref=doc(db,'sidedeskRooms',room),done=0;await runTransaction(db,async t=>{let s=await t.get(ref),d=s.data(),m=d[role];if(!m||m.status==='paused'||m.done>=m.total)return;let n={...m,done:m.done+1,updatedAtMs:Date.now()};if(type==='correct')n.correct=(m.correct||0)+1;if(type==='wrong')n.wrong=(m.wrong||0)+1;if(type==='skip')n.skipped=(m.skipped||0)+1;if(n.done>=n.total)n.status='done';done=n.done;t.update(ref,{[role]:n,updatedAt:serverTimestamp()})});if(done){ownAt=Date.now();await event(type,{done});msg('내 '+L(type)+' 기록이 친구 화면에 전달됐습니다.');tr(name+' · '+L(type))}}
async function pa(){let m=R?.[role];if(!m||m.status==='done')return;let x=m.status==='paused';await updateDoc(doc(db,'sidedeskRooms',room),{[role]:{...m,status:x?'solving':'paused',updatedAtMs:Date.now()},updatedAt:serverTimestamp()});event(x?'resume':'pause')}
async function event(type,x={}){await addDoc(collection(db,'sidedeskRooms',room,'events'),{uid:authUid,nickname:name,type,clientTs:Date.now(),...x,createdAt:serverTimestamp()})}
const L=t=>({correct:'정답',wrong:'오답',skip:'보류',tap:'책상 톡',pause:'잠깐 멈춤',resume:'다시 시작',start:'시작'})[t]||t;
function us(){let m=R?.[role],f=R?.[role==='host'?'guest':'host'];if(!m||!f)return;fill('m',m);fill('x',f);let a=P(m),b=P(f);pace.textContent=a===b?'거의 같은 속도':a>b?'내가 '+(a-b)+'% 앞서는 중':'친구가 '+(b-a)+'% 앞서는 중';pause.textContent=m.status==='paused'?'다시 시작':'잠깐 멈춤';let dis=m.status==='paused'||m.status==='done';ok.disabled=no.disabled=sk.disabled=dis;if(m.status==='done'&&f.status==='done'){rs.textContent='● 세션 완료';ok.disabled=no.disabled=sk.disabled=tap.disabled=pause.disabled=true;msg('둘 다 완료했습니다. 멀리 떨어져 있어도 같은 책상에서 끝낸 셈입니다.')}}
function fill(p,d){document.querySelector('#'+p+'n').textContent=d.nickname;document.querySelector('#'+p+'d').textContent=d.done||0;document.querySelector('#'+p+'t').textContent=d.total;document.querySelector('#'+p+'p').textContent=P(d)+'%';let a=ACC(d);document.querySelector('#'+p+'a').textContent=a==null?'정확도 -':'정확도 '+a+'%';document.querySelector('#'+p+'b').style.width=P(d)+'%';document.querySelector('#'+p+'s').textContent=d.status==='paused'?'잠깐 멈춤':d.status==='done'?'완료':'풀이 중'}
function remote(e){let c=document.querySelector('#friend');c?.classList.remove('flash');void c?.offsetWidth;c?.classList.add('flash');let w=e.nickname||'친구';if(e.type==='tap'){msg(w+'가 책상을 톡 건드렸습니다.');navigator.vibrate?.([20,30,20])}else if(e.type==='pause')msg(w+'가 잠깐 멈췄습니다.');else if(e.type==='resume')msg(w+'가 다시 시작했습니다.');else if(['correct','wrong','skip'].includes(e.type)){msg(w+'가 방금 '+L(e.type)+' 처리했습니다.');if(Date.now()-ownAt<=3000){desk.classList.add('sync');setTimeout(()=>desk.classList.remove('sync'),700);msg('SYNC · 거의 동시에 한 문제를 끝냈습니다.')}}tr(w+' · '+L(e.type))}
function msg(t){let e=document.querySelector('#live');if(e)e.textContent=t}function tr(t){let l=document.querySelector('#trace');if(!l)return;let e=document.createElement('div');e.textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' · '+t;l.prepend(e);while(l.children.length>5)l.lastElementChild.remove()}function ticker(){clearInterval(timer);timer=setInterval(()=>{let s=Math.max(0,((Date.now()-started)/1000)|0);clock.textContent=String((s/60)|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250)}
try{let c=await signInAnonymously(auth);authUid=c.user.uid;landing()}catch(e){console.error(e);fail('실시간 연결용 익명 로그인을 시작하지 못했습니다.')}
</script></body></html>
