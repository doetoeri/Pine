<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Guardian Parent</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17181a;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand h1{margin:0;font-size:30px}.brand p{margin:5px 0;color:#6c727a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:#fff;border:1px solid #e4e7eb;border-radius:20px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.035)}h2{font-size:18px;margin:0 0 13px}.muted{font-size:13px;color:#707780;line-height:1.5}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}label{display:block;font-size:13px;color:#565d66;margin:11px 0 5px}input,textarea,select{width:100%;border:1px solid #d6dbe0;border-radius:11px;padding:10px 11px;background:#fff;font:inherit}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:11px;padding:10px 14px;background:#172019;color:#fff;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e9edf0;color:#20252a}button.danger{background:#8f2d2d}button:disabled{opacity:.45;cursor:default}.hidden{display:none!important}.status{display:inline-block;background:#eef2f4;border-radius:999px;padding:5px 8px;font-size:12px}.device,.request{padding:12px 0;border-top:1px solid #edf0f2}.device:first-child,.request:first-child{border-top:0}.device.active{background:#f7faf7;border-radius:12px;padding:12px}.code{font:800 25px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;word-break:break-all}.ok,.error{padding:10px 12px;border-radius:11px;font-size:13px}.ok{background:#e9f7ee;color:#155b2e}.error{background:#fdecec;color:#8a2424}.days{display:flex;gap:8px;flex-wrap:wrap}.days label{margin:0;display:flex;gap:4px;align-items:center}.days input{width:auto}.pill{background:#eef4ff;color:#294e87;padding:5px 8px;border-radius:999px;font-size:12px}.share-frame{width:100%;max-height:72vh;object-fit:contain;background:#111;border-radius:14px;margin-top:10px;cursor:zoom-in}.footer{font-size:12px;color:#7a8087;margin-top:14px}@media(max-width:640px){.shell{padding:14px}.top{align-items:flex-start}.brand h1{font-size:25px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, getDoc, onSnapshot, query, where, orderBy, limit, runTransaction, Bytes } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyClE6MPOCvqZQ_qRsZwLtml_x5TPR9PnGY",
 authDomain:"studio-2803086992-2d4cf.firebaseapp.com",
 projectId:"studio-2803086992-2d4cf",
 storageBucket:"studio-2803086992-2d4cf.firebasestorage.app",
 messagingSenderId:"747632916477",
 appId:"1:747632916477:web:60ad84854cc97deffb8b94"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
let familyId=null, selectedDeviceId=null, devices=[], unsubs=[], requestUnsub=null, screenShareUnsub=null, attentionUnsub=null, lastFrameUrl=null, attentionReadyAt=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const splitPkgs=v=>[...new Set(v.split(/[\n,]/).map(x=>x.trim()).filter(Boolean))];
const minuteOfDay=v=>{const [h,m]=v.split(":").map(Number);return h*60+m};
const durationMinutes=(s,e)=>e>s?e-s:1440-s+e;
const cleanup=()=>{for(const u of unsubs.splice(0)) try{u()}catch{};if(requestUnsub)try{requestUnsub()}catch{};if(screenShareUnsub)try{screenShareUnsub()}catch{};if(attentionUnsub)try{attentionUnsub()}catch{};requestUnsub=null;screenShareUnsub=null;attentionUnsub=null;if(lastFrameUrl)URL.revokeObjectURL(lastFrameUrl);lastFrameUrl=null};
function message(t,ok=false){$("message").innerHTML=`<div class="${ok?"ok":"error"}">${esc(t)}</div>`}
function token(){const b=new Uint8Array(12);crypto.getRandomValues(b);return btoa(String.fromCharCode(...b)).replaceAll("+","-").replaceAll("/","_").replaceAll("=","")}
function render(){document.querySelector("#app").innerHTML=`<main class="shell">
 <header class="top"><div class="brand"><h1>Guardian Parent</h1><p>실제 Firebase 연결 · 부모 승인형 집중 관리</p></div><button id="logout" class="secondary hidden">로그아웃</button></header>
 <div id="message"></div>
 <section id="authCard" class="card"><h2>부모 로그인</h2><label>이메일</label><input id="email" type="email" autocomplete="email"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"><div class="row" style="margin-top:14px"><button id="signin">로그인</button><button id="signup" class="secondary">계정 만들기</button></div><p class="footer">비밀번호는 이 페이지에 저장하지 않습니다. Firebase Authentication에만 전달됩니다.</p></section>
 <section id="dashboard" class="hidden"><div class="grid">
  <div class="card"><h2>가족</h2><label>가족 선택</label><select id="family"></select><label>새 가족 이름</label><input id="familyName" value="Guardian Family"><button id="createFamily" style="margin-top:10px">가족 만들기</button></div>
  <div class="card"><h2>기기 연결</h2><p class="muted">학생 기기에 아래 토큰을 입력합니다. 10분 뒤 만료됩니다. 토큰은 6자리보다 길어서 추측 공격을 어렵게 했습니다.</p><button id="pairCode">연결 토큰 만들기</button><div id="pairResult"></div></div>
  <div class="card"><h2>기기 상태</h2><div id="devices" class="muted">가족을 선택하세요.</div></div>
  <div class="card"><h2>승인 요청</h2><div id="requests" class="muted">기기를 선택하세요.</div></div>
<div class="card"><h2>주의 이벤트</h2><div id="attentionEvents" class="muted">기기를 선택하세요.</div><p class="muted">부모가 지정한 앱이 실제 전면에 올라온 순간만 기록합니다. 메시지 내용·키 입력·웹 주소는 수집하지 않습니다.</p></div>
    <div class="card"><h2>화면 공유</h2><div id="shareStatus" class="muted">기기를 선택하세요.</div><img id="shareFrame" class="share-frame hidden" alt="Guardian 화면 공유 미리보기"><div class="row" style="margin-top:10px"><button id="requestShare">화면 공유 요청</button><button id="openShareFull" class="secondary">크게 보기</button><button id="stopShare" class="danger">공유 중지</button></div><p class="muted">최대 1080px, 선명도 우선 adaptive JPEG로 갱신됩니다. 학생 기기에서 Android 시스템 동의가 있어야 시작됩니다.</p></div>
 </div>
 <div class="card" style="margin-top:16px"><h2>집중 정책</h2><div class="grid">
  <div><label>대상 기기</label><select id="policyDevice"></select><label>시작</label><input id="start" type="time" value="19:00"><label>종료</label><input id="end" type="time" value="23:00"><label>요일</label><div class="days" id="days">${["월","화","수","목","금","토","일"].map((d,i)=>`<label><input type="checkbox" value="${i+1}" ${i<5?"checked":""}>${d}</label>`).join("")}</div></div>
  <div><label>항상 허용 패키지</label><textarea id="always" placeholder="com.example.school"></textarea><label>공부 허용 패키지</label><textarea id="study" placeholder="com.samsung.android.app.notes"></textarea></div>
  <div><label>차단 패키지</label><textarea id="blocked" placeholder="com.google.android.youtube\ncom.instagram.android"></textarea><label>일일 제한 JSON (분)</label><textarea id="limits" placeholder='{"com.example.app":30}'></textarea></div>
 </div><button id="savePolicy" style="margin-top:14px">정책 저장</button><p class="muted">정책은 Firestore 트랜잭션으로 revision을 1씩 올립니다. 학생 기기는 자기 기기 문서만 읽고 상태를 쓸 수 있습니다.</p></div>
 </section></main>`;bind()}
function bind(){
 $("signin").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value)}catch(e){message(e.message)}};
 $("signup").onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$("email").value,$("password").value);message("부모 계정이 생성되었습니다.",true)}catch(e){message(e.message)}};
 $("logout").onclick=()=>signOut(auth);
 $("createFamily").onclick=createFamily;
 $("pairCode").onclick=createPairCode;
 $("family").onchange=e=>{familyId=e.target.value||null;selectedDeviceId=null;watchFamily()};
 $("policyDevice").onchange=e=>{selectedDeviceId=e.target.value||null;watchRequests();watchScreenShare();watchAttention()};
 $("requestShare").onclick=requestScreenShare;
 $("stopShare").onclick=stopScreenShare;
 $("openShareFull").onclick=()=>openShareFullScreen();
 $("shareFrame").onclick=()=>openShareFullScreen();
 $("savePolicy").onclick=savePolicy;
}
async function createFamily(){if(!auth.currentUser)return;const name=$("familyName").value.trim();if(!name)return message("가족 이름을 입력하세요.");const id=crypto.randomUUID().replaceAll("-","");const now=Date.now();try{await setDoc(doc(db,"guardianFamilies",id),{ownerUid:auth.currentUser.uid,name,createdAtMillis:now,updatedAtMillis:now});familyId=id;message("가족을 만들었습니다.",true)}catch(e){message(e.message)}}
async function createPairCode(){if(!familyId)return message("가족을 먼저 선택하세요.");const code=token();const now=Date.now();try{await setDoc(doc(db,"guardianPairingCodes",code),{familyId,createdByUid:auth.currentUser.uid,createdAtMillis:now,expiresAtMillis:now+10*60*1000,claimed:false,claimedByUid:"",claimedDeviceId:"",claimedAtMillis:0});$("pairResult").innerHTML=`<p class="code">${esc(code.match(/.{1,4}/g).join(" "))}</p><p class="muted">만료 ${new Date(now+600000).toLocaleTimeString()} · 학생 앱에는 공백 없이 입력해도 됩니다.</p>`}catch(e){message(e.message)}}
function watchFamilies(){cleanup();if(!auth.currentUser)return;const q=query(collection(db,"guardianFamilies"),where("ownerUid","==",auth.currentUser.uid));unsubs.push(onSnapshot(q,s=>{const rows=s.docs.map(d=>({id:d.id,...d.data()}));const sel=$("family");sel.innerHTML=rows.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.id)}</option>`).join("");if(!rows.length){familyId=null;$("devices").textContent="가족을 먼저 만드세요.";return}if(!familyId||!rows.some(x=>x.id===familyId))familyId=rows[0].id;sel.value=familyId;watchFamily()},e=>message(e.message)))}
function watchFamily(){for(const u of unsubs.splice(1))try{u()}catch{};if(!familyId)return;const ref=collection(db,"guardianFamilies",familyId,"devices");unsubs.push(onSnapshot(ref,s=>{devices=s.docs.map(d=>({id:d.id,...d.data()}));$("devices").innerHTML=devices.length?devices.map(d=>`<div class="device ${d.id===selectedDeviceId?"active":""}" data-dev="${esc(d.id)}"><b>${esc(d.label||d.id)}</b><div class="row"><span class="status">desired ${Number(d.desiredRevision||0)}</span><span class="status">applied ${Number(d.appliedRevision||0)}</span><span class="status">${d.focusActive?"집중 중":"대기"}</span></div><p class="muted">${esc(d.model||"")} · 마지막 연결 ${d.lastSeenAtMillis?new Date(d.lastSeenAtMillis).toLocaleString():"없음"}</p></div>`).join(""):"연결된 기기가 없습니다.";document.querySelectorAll("[data-dev]").forEach(x=>x.onclick=()=>{selectedDeviceId=x.dataset.dev;$("policyDevice").value=selectedDeviceId;watchRequests();watchScreenShare()});const p=$("policyDevice");p.innerHTML=devices.map(d=>`<option value="${esc(d.id)}">${esc(d.label||d.id)}</option>`).join("");if(!selectedDeviceId||!devices.some(d=>d.id===selectedDeviceId))selectedDeviceId=devices[0]?.id||null;if(selectedDeviceId){p.value=selectedDeviceId;watchRequests();watchScreenShare()}},e=>message(e.message)))}
function watchRequests(){if(requestUnsub)try{requestUnsub()}catch{};requestUnsub=null;if(!familyId||!selectedDeviceId){$("requests").textContent="기기를 선택하세요.";return}const q=query(collection(db,"guardianFamilies",familyId,"devices",selectedDeviceId,"approvalRequests"),orderBy("requestedAtMillis","desc"));requestUnsub=onSnapshot(q,s=>{const rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==="PENDING");$("requests").innerHTML=rows.length?rows.map(r=>`<div class="request"><b>${esc(r.packageName)}</b><p class="muted">${Number(r.requestedDurationMinutes)}분 임시 허용</p><div class="row"><button data-approve="1" data-id="${esc(r.id)}">승인</button><button class="danger" data-approve="0" data-id="${esc(r.id)}">거절</button></div></div>`).join(""):"대기 중 요청이 없습니다.";document.querySelectorAll("#requests button").forEach(b=>b.onclick=()=>respondApproval(b.dataset.id,b.dataset.approve==="1"))},e=>message(e.message))}
function watchScreenShare(){if(screenShareUnsub)try{screenShareUnsub()}catch{};screenShareUnsub=null;if(lastFrameUrl){URL.revokeObjectURL(lastFrameUrl);lastFrameUrl=null}const img=$("shareFrame");img.classList.add("hidden");img.removeAttribute("src");if(!familyId||!selectedDeviceId){$("shareStatus").textContent="기기를 선택하세요.";return}const ref=doc(db,"guardianFamilies",familyId,"devices",selectedDeviceId,"screenShare","current");screenShareUnsub=onSnapshot(ref,s=>{if(!s.exists()){$("shareStatus").textContent="화면 공유 요청 없음";img.classList.add("hidden");return}const d=s.data(),status=String(d.status||"UNKNOWN"),when=d.frameAtMillis?new Date(Number(d.frameAtMillis)).toLocaleTimeString():"";$("shareStatus").textContent=status==="REQUESTED"?"학생 기기에서 동의 대기 중":status==="ACTIVE"?`공유 중 · 최근 프레임 ${when}`:status==="STOP_REQUESTED"?"종료 요청 전달됨":status==="DENIED"?"학생이 공유를 거절함":status==="STOPPED"?"화면 공유 종료됨":`상태: ${status}`;const bytes=d.frame?.toUint8Array?.();if(status==="ACTIVE"&&bytes&&bytes.length){if(lastFrameUrl)URL.revokeObjectURL(lastFrameUrl);lastFrameUrl=URL.createObjectURL(new Blob([bytes],{type:"image/jpeg"}));img.src=lastFrameUrl;img.classList.remove("hidden")}else{img.classList.add("hidden");img.removeAttribute("src")}},e=>message(e.message))}
async function requestScreenShare(){if(!auth.currentUser||!familyId||!selectedDeviceId)return message("대상 기기를 선택하세요.");const now=Date.now(),ref=doc(db,"guardianFamilies",familyId,"devices",selectedDeviceId,"screenShare","current");try{await setDoc(ref,{requestedByUid:auth.currentUser.uid,requestedAtMillis:now,status:"REQUESTED",studentConsentAtMillis:0,stoppedAtMillis:0,frameAtMillis:0,width:0,height:0,sequence:0,frame:Bytes.fromUint8Array(new Uint8Array())});message("화면 공유 요청을 보냈습니다. 학생 기기에서 시스템 동의가 필요합니다.",true)}catch(e){message(e.message)}}
async function stopScreenShare(){if(!familyId||!selectedDeviceId)return;const ref=doc(db,"guardianFamilies",familyId,"devices",selectedDeviceId,"screenShare","current");try{await updateDoc(ref,{status:"STOP_REQUESTED"});message("화면 공유 중지를 요청했습니다.",true)}catch(e){message(e.message)}}
function notifyParent(title,body){try{window.GuardianParentBridge?.showNotification?.(title,body)}catch{};try{if("Notification" in window&&Notification.permission==="granted")new Notification(title,{body})}catch{}}
function watchAttention(){if(attentionUnsub)try{attentionUnsub()}catch{};attentionUnsub=null;if(!familyId||!selectedDeviceId){$("attentionEvents").textContent="기기를 선택하세요.";return}attentionReadyAt=Date.now();const q=query(collection(db,"guardianFamilies",familyId,"devices",selectedDeviceId,"attentionEvents"),orderBy("eventAtMillis","desc"),limit(30));attentionUnsub=onSnapshot(q,s=>{const rows=s.docs.map(d=>({id:d.id,...d.data()}));$("attentionEvents").innerHTML=rows.length?rows.map(r=>`<div class="request"><b>${esc(r.appLabel||r.packageName)}</b><div class="row"><span class="status">${r.focusActive?"집중시간":"일반시간"}</span><span class="status">${new Date(Number(r.eventAtMillis||0)).toLocaleTimeString()}</span></div><p class="muted">${esc(r.packageName||"")}</p></div>`).join(""):"최근 주의 이벤트가 없습니다.";for(const ch of s.docChanges()){if(ch.type!=="added")continue;const d=ch.doc.data(),at=Number(d.eventAtMillis||0);if(at<attentionReadyAt-3000)continue;notifyParent("Guardian · 앱 실행 감지",`${d.appLabel||d.packageName} 실행 · ${d.focusActive?"집중시간":"일반시간"}`)}} ,e=>message(e.message))}
function openShareFullScreen(){const img=$("shareFrame");if(img.classList.contains("hidden"))return message("현재 표시할 화면이 없습니다.");if(img.requestFullscreen)img.requestFullscreen().catch(()=>{});}
async function savePolicy(){if(!familyId||!selectedDeviceId)return message("대상 기기를 선택하세요.");const start=minuteOfDay($("start").value),end=minuteOfDay($("end").value);if(durationMinutes(start,end)>480)return message("집중 세션은 안전상 8시간 이하만 저장할 수 있습니다.");const days=[...document.querySelectorAll("#days input:checked")].map(x=>Number(x.value));if(!days.length)return message("요일을 하나 이상 고르세요.");let limits={};try{const raw=$("limits").value.trim();if(raw){const p=JSON.parse(raw);for(const [k,v] of Object.entries(p)){const n=Number(v);if(!Number.isFinite(n)||n<1||n>1440)throw new Error(`${k} 제한은 1~1440분이어야 합니다.`);limits[k]=Math.round(n*60000)}}}catch(e){return message(e.message)}const pr=doc(db,"guardianFamilies",familyId,"devices",selectedDeviceId,"desired","current"),dr=doc(db,"guardianFamilies",familyId,"devices",selectedDeviceId);try{let revision=0;await runTransaction(db,async tx=>{const snap=await tx.get(pr);revision=snap.exists()?Number(snap.data().revision||0)+1:1;const old=snap.exists()?snap.data():{};tx.set(pr,{revision,days,startMinuteOfDay:start,endMinuteOfDay:end,zoneId:"Asia/Seoul",alwaysAllowed:splitPkgs($("always").value),studyAllowed:splitPkgs($("study").value),blocked:splitPkgs($("blocked").value),notifyPackages:splitPkgs($("notifyApps").value),dailyLimitsMillis:limits,temporaryAllowances:old.temporaryAllowances||{},updatedAtMillis:Date.now()});tx.update(dr,{desiredRevision:revision})});message(`정책 revision ${revision} 저장 완료`,true)}catch(e){message(e.message)}}
async function respondApproval(id,approve){if(!familyId||!selectedDeviceId)return;const ar=doc(db,"guardianFamilies",familyId,"devices",selectedDeviceId,"approvalRequests",id),pr=doc(db,"guardianFamilies",familyId,"devices",selectedDeviceId,"desired","current"),dr=doc(db,"guardianFamilies",familyId,"devices",selectedDeviceId);try{await runTransaction(db,async tx=>{const a=await tx.get(ar);if(!a.exists()||a.data().status!=="PENDING")throw new Error("이미 처리된 요청입니다.");const now=Date.now();if(!approve){tx.update(ar,{status:"DENIED",resolvedAtMillis:now,allowanceExpiresAtMillis:0});return}const p=await tx.get(pr);if(!p.exists())throw new Error("먼저 집중 정책을 저장하세요.");const pd=p.data(),revision=Number(pd.revision)+1,expires=now+Math.min(Number(a.data().requestedDurationMinutes),120)*60000;tx.set(pr,{...pd,revision,temporaryAllowances:{...(pd.temporaryAllowances||{}),[a.data().packageName]:expires},updatedAtMillis:now});tx.update(dr,{desiredRevision:revision});tx.update(ar,{status:"APPROVED",resolvedAtMillis:now,allowanceExpiresAtMillis:expires})});message(approve?"임시 허용을 승인했습니다.":"요청을 거절했습니다.",true)}catch(e){message(e.message)}}
onAuthStateChanged(auth,u=>{$("authCard").classList.toggle("hidden",!!u);$("dashboard").classList.toggle("hidden",!u);$("logout").classList.toggle("hidden",!u);cleanup();familyId=null;selectedDeviceId=null;if(u)watchFamilies()});
render();
</script>
</body>
</html>
